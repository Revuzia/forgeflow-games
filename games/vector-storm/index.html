<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Vector Storm - ForgeFlow Games</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100vw;height:100vh;overflow:hidden;background:#0a0e1a;font-family:system-ui,sans-serif;color:#cbd5e1}
#game-container{position:fixed;inset:0;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
canvas{display:block;max-width:100%;max-height:100%}
</style>
<script src="https://cdn.jsdelivr.net/npm/phaser@3.90.0/dist/phaser.min.js"></script>
<!-- Portal SDK: leaderboard + achievements. Absolute URL so it works in
     iframe + standalone. Loads before game.js so window.ForgeFlow exists. -->
<script src="https://forgeflowgames.com/forgeflow-sdk.js"></script>

<style id="ffg-cursor">/* ForgeFlow themed cursors — injected 2026-07-10 */
html,body{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2728%27%20height%3D%2728%27%20viewBox%3D%270%200%2028%2028%27%3E%3Cpath%20d%3D%27M4%202%20L24%2013%20L15%2016%20L11%2026%20Z%27%20fill%3D%27%230a0e2a%27%20stroke%3D%27%23818cf8%27%20stroke-width%3D%272%27%20stroke-linejoin%3D%27round%27%2F%3E%3Ccircle%20cx%3D%2719%27%20cy%3D%2711%27%20r%3D%272.2%27%20fill%3D%27%23f0abfc%27%2F%3E%3C%2Fsvg%3E") 4 2, auto;}
canvas{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2734%27%20height%3D%2734%27%20viewBox%3D%270%200%2034%2034%27%3E%3Ccircle%20cx%3D%2717%27%20cy%3D%2717%27%20r%3D%2711%27%20fill%3D%27none%27%20stroke%3D%27%23000%27%20stroke-width%3D%275%27%20opacity%3D%270.55%27%2F%3E%3Ccircle%20cx%3D%2717%27%20cy%3D%2717%27%20r%3D%2711%27%20fill%3D%27none%27%20stroke%3D%27%23818cf8%27%20stroke-width%3D%272.2%27%2F%3E%3Cpath%20d%3D%27M17%202%20v6%20M17%2026%20v6%20M2%2017%20h6%20M26%2017%20h6%27%20stroke%3D%27%23f0abfc%27%20stroke-width%3D%273%27%20stroke-linecap%3D%27round%27%2F%3E%3Ccircle%20cx%3D%2717%27%20cy%3D%2717%27%20r%3D%272.4%27%20fill%3D%27%23f0abfc%27%20stroke%3D%27%23000%27%20stroke-width%3D%271%27%2F%3E%3C%2Fsvg%3E") 17 17, crosshair;}
button,a,select,input,label,[role=button],.btn{cursor:url("data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%27%20width%3D%2728%27%20height%3D%2728%27%20viewBox%3D%270%200%2028%2028%27%3E%3Cpath%20d%3D%27M4%202%20L24%2013%20L15%2016%20L11%2026%20Z%27%20fill%3D%27%230a0e2a%27%20stroke%3D%27%23818cf8%27%20stroke-width%3D%272%27%20stroke-linejoin%3D%27round%27%2F%3E%3Ccircle%20cx%3D%2719%27%20cy%3D%2711%27%20r%3D%272.2%27%20fill%3D%27%23f0abfc%27%2F%3E%3C%2Fsvg%3E") 4 2, auto;}
</style>

<style id="ffg-guard">/* no text/image highlighting inside the game */
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
</style>
</head>
<body>
<div id="game-container"></div>
<!-- 2026-05-06 — Cache-bust the inner game.js per iframe load. The portal
     iframe URL already has ?v=<build_version>-<nonce>, but the browser
     was still serving stale cached `game.js` because the SCRIPT tag URL
     was static. document.write at iframe-mount time guarantees a unique
     game.js URL on every fresh load → no more "I'm playing yesterday's
     game.js after a deploy". -->
<script>document.write('<scr'+'ipt src="game.js?v='+Date.now()+'"></scr'+'ipt>');</script>
<script>window.GAME_CONFIG=window.GAME_CONFIG||{hide_bug_button:true};</script>
<script src="game_controls.js"></script>
</body>
</html>
