<!--
  No inline script and no inline style on this page, so the production build runs under a strict Content Security Policy.
  Recommended response header for dist/ (the CDN or the portal sets it; a <meta> tag cannot carry frame-ancestors):
    Content-Security-Policy: default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self';
      font-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors <the portal origin>
  img-src data: covers the favicon below and the Quality select's arrow (src/ui/styles.css). The app sets styles only through the CSSOM
  (element.style.setProperty), which style-src 'self' allows. _harness/browser_shell.mjs serves the built dist/ with this policy
  (frame-ancestors aside) and fails on any CSP violation. The dev server (vite) injects inline modules and styles: dev is not covered.
-->
