<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(gloock.woff2)}
@font-face{font-family:I;src:url(inst.woff2);font-weight:400 700}
html,body{margin:0;width:1280px;height:960px;overflow:hidden;background:#7d93b3}
.fill{position:absolute;inset:-80px;background:url(bg.png) 50% 0/auto 140%;filter:blur(36px) saturate(.9)}
.art{position:absolute;left:50%;bottom:0;height:760px;transform:translateX(-50%);
 -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 140px)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 120% 90% at 50% 60%,rgba(0,0,0,0) 60%,rgba(0,0,0,.4))}
.logo{position:absolute;top:150px;left:0;right:0;text-align:center}
.w{font-family:G;font-size:175px;line-height:1;letter-spacing:.06em;margin-left:.06em;
 background:linear-gradient(180deg,#fffaf0 0%,#f3e6cc 55%,#d9b98a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 5px 0 rgba(20,22,40,.85)) drop-shadow(0 0 24px rgba(10,14,30,.7))}
.t{margin-top:2px;font-family:I;font-weight:700;font-size:40px;letter-spacing:.2em;color:#fff7e8;
 text-shadow:0 3px 0 rgba(15,18,35,.9),0 0 16px rgba(10,14,30,.8)}
</style></head><body><div class="fill"></div><img class="art" src="bg.png"><div class="vig"></div>
<div class="logo"><div class="w">VALE</div><div class="t">5v5 TEAM BATTLES</div></div></body></html>
