<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:G;src:url(gloock.woff2)}
@font-face{font-family:I;src:url(inst.woff2);font-weight:400 700}
html,body{margin:0;width:1920px;height:1080px;overflow:hidden;background:#000}
.bg{position:absolute;inset:0;background:url(bg.png) center/cover}
.vig{position:absolute;inset:0;background:
 radial-gradient(ellipse 70% 45% at 50% 0%,rgba(10,16,30,.55),rgba(10,16,30,0) 70%),
 radial-gradient(ellipse 120% 90% at 50% 55%,rgba(0,0,0,0) 60%,rgba(0,0,0,.45))}
.logo{position:absolute;top:56px;left:0;right:0;text-align:center}
.w{font-family:G;font-size:250px;line-height:1;letter-spacing:.06em;margin-left:.06em;color:#f6efe2;
 background:linear-gradient(180deg,#fffaf0 0%,#f3e6cc 55%,#d9b98a 100%);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;
 filter:drop-shadow(0 6px 0 rgba(20,22,40,.85)) drop-shadow(0 0 28px rgba(10,14,30,.7))}
.t{margin-top:4px;display:inline-flex;align-items:center;gap:26px;font-family:I;font-weight:700;font-size:50px;letter-spacing:.22em;color:#fff7e8;
 text-shadow:0 3px 0 rgba(15,18,35,.9),0 0 18px rgba(10,14,30,.8)}
.t i{display:block;width:90px;height:3px;background:linear-gradient(90deg,rgba(255,240,215,0),#ffe9c4)}
.t i:last-child{transform:scaleX(-1)}
</style></head><body><div class="bg"></div><div class="vig"></div>
<div class="logo"><div class="w">VALE</div><div class="t"><i></i>5v5 TEAM BATTLES<i></i></div></div></body></html>
