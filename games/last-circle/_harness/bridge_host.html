<!doctype html><meta charset="utf-8"><title>lc bridge host</title>
<style>html,body{margin:0;background:#111}iframe{width:100%;height:92vh;border:0}</style>
<body>
<script>
/* Stands in for the forgeflowgames portal for Last Circle.
     reply=record  a deep account earned on ANOTHER device
     reply=none    no answer -> the game's read must not unlock writes        */
const MODE = new URLSearchParams(location.search).get('reply') || 'record';
const ACCOUNT = { progress: {
  level:40, xp:820, lastPlayedDay:"2026-09-10", dayStreak:6,
  career:{matches:120,wins:14,kills:430,damage:99000,bestPlacement:1,top10s:60,
          timeAliveS:40000,placementSum:900,
          mapWins:{harbor:5,spire:9}, killsByCls:{scout:200,heavy:230}}
}, skin:"vanguard" };
window.__BRIDGE = { mode:MODE, loads:0, saves:[], record: JSON.parse(JSON.stringify(ACCOUNT)) };
addEventListener('message', (e) => {
  const m = e.data; if (!m || typeof m !== 'object') return;
  if (m.type === 'forgeflow:load') {
    __BRIDGE.loads++;
    if (MODE === 'none') return;
    e.source.postMessage({type:'forgeflow:save_loaded', data:__BRIDGE.record, _reqId:m._reqId}, '*');
  } else if (m.type === 'forgeflow:save') {
    __BRIDGE.saves.push(m.data); __BRIDGE.record = m.data;   // portal upserts by replacement
  }
});
const f=document.createElement('iframe'); f.src='../index.html'; document.body.appendChild(f); window.__frame=f;
</script>
