<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>ASCENDANT — ForgeFlow Games</title>
<!-- Inline icon: without one the browser requests /favicon.ico and logs a 404 that
     shows up as a console error in every automated check. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%230a1020'/%3E%3Cpath d='M16 5 L26 27 H19.5 L16 18.5 L12.5 27 H6 Z' fill='%237ef0ff'/%3E%3C/svg%3E">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;background:#05070d;font-family:'Segoe UI',system-ui,sans-serif;touch-action:none}
#game-container{width:100%;height:100%;position:relative}
canvas{display:block}
#hud{position:absolute;inset:0;pointer-events:none;overflow:hidden;user-select:none;-webkit-user-select:none;z-index:10}
#ui{position:absolute;inset:0;z-index:20;pointer-events:none}
#boot{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:radial-gradient(120% 100% at 50% 40%,#101a2e,#05070d 70%);color:#cfe4ff;transition:opacity .5s ease}
#boot.gone{opacity:0;pointer-events:none}
#boot .brand{font-size:clamp(38px,7vw,86px);font-weight:200;letter-spacing:.42em;margin-left:.42em;
  background:linear-gradient(180deg,#eaf4ff,#5ec8ff 60%,#2b7fd8);-webkit-background-clip:text;background-clip:text;color:transparent}
#boot .sub{margin-top:10px;font-size:12px;letter-spacing:.5em;color:#4e6a8f;text-transform:uppercase}
#boot .bar{margin-top:34px;width:min(360px,60vw);height:2px;background:#16243a;overflow:hidden}
#boot .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#2b7fd8,#7ef0ff);transition:width .3s ease}
#boot .msg{margin-top:12px;font-size:11px;letter-spacing:.22em;color:#38506e;min-height:14px;text-transform:uppercase}
#nogpu{position:absolute;inset:0;z-index:70;display:none;align-items:center;justify-content:center;text-align:center;
  background:#05070d;color:#ff8a6b;font-size:15px;padding:40px;line-height:1.7}
</style>
<script type="importmap">
{ "imports": { "three": "./assets/vendor/three/build/three.module.js", "three/addons/": "./assets/vendor/three/examples/jsm/" } }
</script>
<style id="ffg-guard">
*{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,[contenteditable]{-webkit-user-select:text;user-select:text}
img{-webkit-user-drag:none}
</style>
</head><body>
<div id="game-container"></div>
<div id="hud"></div>
<div id="ui"></div>
<div id="boot">
  <div class="brand">ASCENDANT</div>
  <div class="sub">Parkour Trials</div>
  <div class="bar"><i id="boot-bar"></i></div>
  <div class="msg" id="boot-msg">initialising</div>
</div>
<div id="nogpu">WebGL 2 is unavailable in this browser.<br>Enable hardware acceleration and reload.</div>
<script>window.GAME_CONFIG={hide_bug_button:true,fs_hotkey:false};</script>
<script src="game_controls.js?v=1"></script>
<script type="module" src="runtime/boot.js?v=1"></script>
</body></html>
