<!doctype html><meta charset="utf-8"><title>bridge host</title>
<style>html,body{margin:0;background:#111}iframe{width:100%;height:92vh;border:0}</style>
<body>
<script>
/* Stands in for the forgeflowgames portal: holds ONE account record and speaks
   the gameBridge protocol. `reply` picks the failure mode being reproduced.
     reply=record  a healthy account with progress
     reply=none    no answer at all -> the game's read times out
     reply=null    a reply carrying a null record (genuinely empty cloud)     */
const Q = new URLSearchParams(location.search);
const MODE = Q.get('reply') || 'record';
const ACCOUNT = { v:1, at:Date.now(), unlockAll:false, stages:{
  'neon-1':{id:'neon-1',cleared:true,best:41.2,deaths:9,coins:[0],clears:1},
  'neon-2':{id:'neon-2',cleared:true,best:63.7,deaths:22,coins:[],clears:1},
  'neon-3':{id:'neon-3',cleared:true,best:88.1,deaths:40,coins:[],clears:1},
  'foundry-1':{id:'foundry-1',cleared:true,best:52.0,deaths:31,coins:[],clears:1}
}};
window.__BRIDGE = { mode:MODE, loads:0, saves:[], record: JSON.parse(JSON.stringify(ACCOUNT)) };
addEventListener('message', (e) => {
  const m = e.data; if (!m || typeof m !== 'object') return;
  if (m.type === 'forgeflow:load') {
    __BRIDGE.loads++;
    if (MODE === 'none') return;                       // never answer
    const data = (MODE === 'null') ? null : __BRIDGE.record;
    e.source.postMessage({type:'forgeflow:save_loaded', data, _reqId:m._reqId}, '*');
  } else if (m.type === 'forgeflow:save') {
    // the portal UPSERTS BY REPLACEMENT — model that exactly
    __BRIDGE.saves.push(m.data);
    __BRIDGE.record = m.data;
  }
});
const f = document.createElement('iframe');
f.src = '../index.html?dev=1';
document.body.appendChild(f);
window.__frame = f;
</script>
