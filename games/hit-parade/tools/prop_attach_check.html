<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>prop attach check</title>
<!-- Lane ASSETS: props in the hand exactly as the game attaches them (view/fighters.ts attachProp, CONTRACT 17.1):
     the prop's world matrix = hand bone world matrix with its scale stripped to (+-1, 1, 1) x compose(pos, euler XYZ
     rotDeg, 1). Loads the SHIPPED fighter GLB (meshopt + webp) and the SHIPPED prop GLBs with three 0.186.
     Query: ?job=<url of a job json>. Job = { fighter, facing: 1, tiles: [{ clip, t | "contact" | "mid", props:
     [{ id, attach? (overrides the GLB extras) }], cam: "game"|"close"|"hand", hand?: "RightHand" }], measure:
     { clips: [[clip, t]], hands: [bone...] } }. Result: window.__RESULT__ (png + per-tile numbers). ASCII only. -->
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "/hit-parade/node_modules/three/build/three.module.js",
  "three/addons/": "/hit-parade/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const DEG = Math.PI / 180;
const q = new URLSearchParams(location.search);
const res = { ok: false, tiles: [], measure: {} };
window.__RESULT__ = null;
const FINGERS = ['Thumb1', 'Thumb2', 'Thumb3', 'Thumb4', 'Index1', 'Index2', 'Index3', 'Index4', 'Middle1', 'Middle2',
  'Middle3', 'Middle4', 'Ring1', 'Ring2', 'Ring3', 'Ring4', 'Pinky1', 'Pinky2', 'Pinky3', 'Pinky4'];
const norm = (n) => n.replace(/^mixamorig\d*[:_]?/, 'mixamorig');
const r4 = (v) => +v.toFixed(4);
try {
  const job = await (await fetch(q.get('job'), { cache: 'no-store' })).json();
  const loader = new GLTFLoader();
  loader.setMeshoptDecoder(MeshoptDecoder);
  const t0 = performance.now();
  const gltf = await loader.loadAsync(job.fighterUrl || `/hit-parade/art/gltf/fighters/${job.fighter}.glb`);
  res.loadMs = Math.round(performance.now() - t0);
  const root = gltf.scene;
  root.traverse((o) => { if (o.name) o.name = norm(o.name); if (o.isSkinnedMesh) o.frustumCulled = false; });
  for (const c of gltf.animations) for (const t of c.tracks) { const d = t.name.indexOf('.'); t.name = norm(t.name.slice(0, d)) + t.name.slice(d); }
  const facing = job.facing ?? 1;
  const holder = new THREE.Group();
  holder.add(root);
  holder.rotation.y = facing * 90 * DEG;
  if (facing < 0 && job.mirror !== false) holder.scale.set(-1, 1, 1);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x2a2e36);
  scene.add(holder);
  const mixer = new THREE.AnimationMixer(root);
  const clipInfo = job.clipsUrl ? (await (await fetch(job.clipsUrl, { cache: 'no-store' })).json()).clips : {};
  const bone = (n) => root.getObjectByName('mixamorig' + n);
  const pose = (clipName, tSpec) => {
    mixer.stopAllAction();
    if (!clipName) { holder.updateMatrixWorld(true); return 0; }
    const clip = gltf.animations.find((a) => a.name === clipName);
    if (!clip) throw new Error('clip missing: ' + clipName);
    const ci = clipInfo[clipName] || {};
    let t = tSpec;
    if (tSpec === 'contact') t = ci.contact ?? clip.duration / 2;
    else if (tSpec === 'mid') t = clip.duration / 2;
    else if (typeof tSpec === 'string' && tSpec.endsWith('%')) t = clip.duration * parseFloat(tSpec) / 100;
    const act = mixer.clipAction(clip);
    act.reset(); act.play(); act.time = t;
    mixer.update(0);
    holder.updateMatrixWorld(true);
    return t;
  };
  // the view's solve: bone world matrix, scale stripped (sign of x kept for the mirror), x attach offset
  const mp = new THREE.Vector3(), mq = new THREE.Quaternion(), ms = new THREE.Vector3();
  const boneFrame = (b) => { b.matrixWorld.decompose(mp, mq, ms); return new THREE.Matrix4().compose(mp, mq, ms.set(ms.x < 0 ? -1 : 1, 1, 1)); };
  const attachMatrix = (a) => new THREE.Matrix4().compose(new THREE.Vector3(...a.pos),
    new THREE.Quaternion().setFromEuler(new THREE.Euler(a.rotDeg[0] * DEG, a.rotDeg[1] * DEG, a.rotDeg[2] * DEG)), new THREE.Vector3(1, 1, 1));

  // ---- measure: finger landmarks in each hand bone's scale-stripped local frame
  if (job.measure) {
    for (const [clipName, tSpec] of job.measure.clips) {
      const t = pose(clipName, tSpec);
      const key = (clipName || 'bind') + '@' + (+t).toFixed(3);
      res.measure[key] = {};
      for (const hand of job.measure.hands) {
        const hb = bone(hand);
        if (!hb) { res.measure[key][hand] = { error: 'no bone' }; continue; }
        const inv = boneFrame(hb).invert();
        const side = hand.startsWith('Left') ? 'LeftHand' : 'RightHand';
        const out = { world: hb.getWorldPosition(new THREE.Vector3()).toArray().map(r4) };
        for (const f of FINGERS) {
          const fb = bone(side + f);
          if (fb) out[f] = fb.getWorldPosition(new THREE.Vector3()).applyMatrix4(inv).toArray().map(r4);
        }
        const fa = bone(side === 'RightHand' ? 'RightForeArm' : 'LeftForeArm');
        if (fa) out.ForeArm = fa.getWorldPosition(new THREE.Vector3()).applyMatrix4(inv).toArray().map(r4);
        // the other hand and the head in THIS hand's frame (two-handed grips, drinking)
        const oh = bone(side === 'RightHand' ? 'LeftHand' : 'RightHand');
        if (oh) out.OtherHand = oh.getWorldPosition(new THREE.Vector3()).applyMatrix4(inv).toArray().map(r4);
        const om = bone(side === 'RightHand' ? 'LeftHandMiddle1' : 'RightHandMiddle1');
        if (om) out.OtherMiddle1 = om.getWorldPosition(new THREE.Vector3()).applyMatrix4(inv).toArray().map(r4);
        const hd = bone('Head');
        if (hd) { out.Head = hd.getWorldPosition(new THREE.Vector3()).applyMatrix4(inv).toArray().map(r4);
          out.HeadWorld = hd.getWorldPosition(new THREE.Vector3()).toArray().map(r4); }
        // world directions of the bone-local axes (fighter-local: x fwd when facing +1)
        hb.matrixWorld.decompose(mp, mq, ms);
        out.axesWorld = ['x', 'y', 'z'].map((k) => new THREE.Vector3(k === 'x' ? 1 : 0, k === 'y' ? 1 : 0, k === 'z' ? 1 : 0).applyQuaternion(mq).toArray().map(r4));
        res.measure[key][hand] = out;
      }
    }
  }

  // ---- render tiles
  if (job.tiles && job.tiles.length) {
    const TW = job.tileW || 360, TH = job.tileH || 360, cols = job.cols || 4;
    const rows = Math.ceil(job.tiles.length / cols);
    const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
    renderer.setPixelRatio(1);
    renderer.setSize(TW * cols, TH * rows);
    renderer.setScissorTest(true);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.NeutralToneMapping;
    document.body.appendChild(renderer.domElement);
    scene.add(new THREE.HemisphereLight(0xffffff, 0x3a3a44, 1.2));
    const sun = new THREE.DirectionalLight(0xffffff, 2.2); sun.position.set(2, 4, 5); scene.add(sun);
    const rim = new THREE.DirectionalLight(0xbfd8ff, 1.0); rim.position.set(-3, 2, -4); scene.add(rim);
    const floor = new THREE.Mesh(new THREE.PlaneGeometry(10, 4), new THREE.MeshStandardMaterial({ color: 0x505660 }));
    floor.rotation.x = -Math.PI / 2; scene.add(floor);
    if (job.envUrl) {
      const { HDRLoader } = await import('three/addons/loaders/HDRLoader.js');
      const hdr = await new HDRLoader().loadAsync(job.envUrl);
      hdr.mapping = THREE.EquirectangularReflectionMapping;
      scene.environment = hdr; scene.environmentIntensity = job.envIntensity ?? 0.6;
    }
    const propCache = new Map();
    const loadProp = async (id) => {
      if (!propCache.has(id)) propCache.set(id, loader.loadAsync(job.propUrl ? job.propUrl.replace('{id}', id) : `/hit-parade/art/gltf/props/${id}.glb`));
      return propCache.get(id);
    };
    const cam = new THREE.PerspectiveCamera(35, TW / TH, 0.02, 100);
    for (let i = 0; i < job.tiles.length; i++) {
      const tile = job.tiles[i];
      const t = pose(tile.clip, tile.t ?? 'mid');
      const live = [];
      const info = { clip: tile.clip, t: r4(t), props: [] };
      for (const p of tile.props || []) {
        const g = await loadProp(p.id);
        let meta = p.attach || null;
        if (!meta) g.scene.traverse((x) => { if (!meta && x.userData && x.userData.attach) meta = x.userData.attach; });
        const o = g.scene.clone(true);
        o.matrixAutoUpdate = false;
        const hb = bone(meta.bone);
        if (!hb) { info.props.push({ id: p.id, error: 'no bone ' + meta.bone }); continue; }
        o.matrix.copy(boneFrame(hb).multiply(attachMatrix(meta)));
        o.matrixWorldNeedsUpdate = true;
        scene.add(o); live.push(o);
        o.updateMatrixWorld(true);
        const box = new THREE.Box3().setFromObject(o, true);
        info.props.push({ id: p.id, bone: meta.bone, pos: meta.pos, rotDeg: meta.rotDeg, box: [box.min.toArray().map(r4), box.max.toArray().map(r4)] });
      }
      // camera
      const hb = bone(tile.hand || 'RightHand');
      const hp = hb ? hb.getWorldPosition(new THREE.Vector3()) : new THREE.Vector3(0, 1.2, 0);
      if (tile.cam === 'close' || tile.cam === 'hand') {
        const d = tile.cam === 'hand' ? (tile.dist || 0.55) : (tile.dist || 1.3);
        const az = (tile.az ?? 20) * DEG, el = (tile.el ?? 10) * DEG;
        cam.position.set(hp.x + d * Math.sin(az) * Math.cos(el), hp.y + d * Math.sin(el), hp.z + d * Math.cos(az) * Math.cos(el));
        cam.lookAt(hp);
      } else {
        cam.position.set(0.3 * facing, 1.25, 4.6); cam.lookAt(0.3 * facing, 1.0, 0);
      }
      cam.updateProjectionMatrix();
      const x = (i % cols) * TW, y = (rows - 1 - Math.floor(i / cols)) * TH;
      renderer.setViewport(x, y, TW, TH); renderer.setScissor(x, y, TW, TH);
      renderer.render(scene, cam);
      for (const o of live) scene.remove(o);
      res.tiles.push(info);
    }
    res.png = renderer.domElement.toDataURL('image/png');
    res.cols = cols; res.tile = [TW, TH];
  }
  res.ok = true;
} catch (e) {
  res.error = String(e && e.stack || e);
}
window.__RESULT__ = res;
</script>
</body>
</html>
