<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fighter glb check</title>
<!-- Lane ASSETS: loads ONE shipped fighter GLB (meshopt + webp) with three 0.186 (this game's node_modules)
     + GLTFLoader + MeshoptDecoder, exactly as the game will. Rotates the root to yaw +90 deg (facing +X,
     CONTRACT 2) and renders every clip at its contact time (or mid-clip) through the game camera
     (vFOV 35, camera on +Z at 1.25 m looking at y 1.0). Per clip it measures the skinned bounding box
     (lowest point) and the clips.json effector point in fighter-local metres.
     Query: ?glb=<url>&cj=<clips.json url>&cols=6   Result: window.__RESULT__. ASCII only. -->
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
<script type="importmap">
{ "imports": {
  "three": "/hit-parade/node_modules/three/build/three.module.js",
  "three/addons/": "/hit-parade/node_modules/three/examples/jsm/"
} }
</script>
</head>
<body>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';

const q = new URLSearchParams(location.search);
const res = { ok: false, clips: {} };
window.__RESULT__ = null;
const EFF = { RightHand: 'RightHandMiddle1', LeftHand: 'LeftHandMiddle1', RightFoot: 'RightToeBase',
  LeftFoot: 'LeftToeBase', RightKnee: 'RightLeg', LeftKnee: 'LeftLeg', Head: 'HeadTop_End' };
try {
  const cj = await (await fetch(q.get('cj'), { cache: 'no-store' })).json();
  const names = Object.keys(cj.clips);
  const cols = parseInt(q.get('cols') || '6', 10);
  const TW = 200, TH = 260;
  const rows = Math.ceil(names.length / cols);
  const renderer = new THREE.WebGLRenderer({ antialias: true, preserveDrawingBuffer: true });
  renderer.setPixelRatio(1);
  renderer.setSize(TW * cols, TH * rows);
  renderer.setScissorTest(true);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  renderer.toneMapping = THREE.NeutralToneMapping;
  document.body.appendChild(renderer.domElement);
  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x30343c);
  scene.add(new THREE.HemisphereLight(0xffffff, 0x404048, 1.3));
  const sun = new THREE.DirectionalLight(0xffffff, 2.0);
  sun.position.set(2, 4, 5);
  scene.add(sun);
  const floor = new THREE.Mesh(new THREE.PlaneGeometry(8, 3), new THREE.MeshStandardMaterial({ color: 0x5a5f68 }));
  floor.rotation.x = -Math.PI / 2;
  scene.add(floor);

  const loader = new GLTFLoader();
  loader.setMeshoptDecoder(MeshoptDecoder);
  const t0 = performance.now();
  const gltf = await loader.loadAsync(q.get('glb'));
  res.loadMs = Math.round(performance.now() - t0);
  const root = gltf.scene;
  root.rotation.y = Math.PI / 2;          // facing +1 -> face +X (CONTRACT 2)
  scene.add(root);
  let skinned = 0, bones = 0;
  const mats = [];
  root.traverse((o) => {
    if (o.isSkinnedMesh) { skinned++; bones = Math.max(bones, o.skeleton.bones.length); o.frustumCulled = false;
      const ms = Array.isArray(o.material) ? o.material : [o.material];
      for (const m of ms) mats.push({ name: m.name, alphaTest: m.alphaTest, transparent: m.transparent,
        map: m.map ? [m.map.image.width, m.map.image.height] : null }); }
  });
  res.skinnedMeshes = skinned; res.maxBones = bones; res.materials = mats;
  res.animations = gltf.animations.map((a) => a.name);
  res.missingInGlb = names.filter((n) => !res.animations.includes(n));
  res.extraInGlb = res.animations.filter((n) => !names.includes(n));
  const mixer = new THREE.AnimationMixer(root);
  const cam = new THREE.PerspectiveCamera(35, TW / TH, 0.05, 100);
  cam.position.set(0, 1.25, 5.2);
  cam.lookAt(0, 1.0, 0);
  const tmp = new THREE.Vector3();
  names.forEach((n, i) => {
    const clip = gltf.animations.find((a) => a.name === n);
    const c = cj.clips[n];
    if (!clip) { res.clips[n] = { error: 'missing' }; return; }
    mixer.stopAllAction();
    const act = mixer.clipAction(clip);
    act.reset(); act.play();
    const t = c.contact != null ? c.contact : c.dur / 2;
    act.time = t;
    mixer.update(0);
    root.updateMatrixWorld(true);
    const box = new THREE.Box3().setFromObject(root, true);
    const r = { t: +t.toFixed(4), minY: +box.min.y.toFixed(4), maxY: +box.max.y.toFixed(4), tracks: clip.tracks.length,
      dur: +clip.duration.toFixed(4) };
    if (c.effector) {
      const b = root.getObjectByName('mixamorig' + EFF[c.effector.bone]);
      if (b) { b.getWorldPosition(tmp); r.effectorThree = [+tmp.x.toFixed(4), +tmp.y.toFixed(4)];   // x = forward when facing +X
        r.effectorJson = c.effector.at; }
    }
    res.clips[n] = r;
    const x = (i % cols) * TW, y = (rows - 1 - Math.floor(i / cols)) * TH;
    renderer.setViewport(x, y, TW, TH); renderer.setScissor(x, y, TW, TH);
    renderer.render(scene, cam);
  });
  res.png = renderer.domElement.toDataURL('image/png');
  res.names = names; res.cols = cols; res.tile = [TW, TH];
  res.ok = true;
} catch (e) {
  res.error = String(e && e.stack || e);
}
window.__RESULT__ = res;
</script>
</body>
</html>
