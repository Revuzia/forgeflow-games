<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HIT PARADE audio lab</title>
  <style>
    :root { color-scheme: dark; --bg: #121218; --fg: #e8e6e3; --dim: #8a8894; --acc: #ffcc33; --bad: #ff5c5c; --ok: #5cd67a; }
    body { margin: 0; padding: 16px; background: var(--bg); color: var(--fg); font: 14px/1.4 system-ui, sans-serif; }
    h1 { font-size: 18px; margin: 0 0 4px; color: var(--acc); }
    h2 { font-size: 14px; margin: 18px 0 6px; color: var(--dim); text-transform: uppercase; letter-spacing: .06em; }
    .row { display: flex; flex-wrap: wrap; gap: 6px; }
    button { background: #23232d; color: var(--fg); border: 1px solid #3a3a48; border-radius: 4px; padding: 4px 8px; font: inherit; cursor: pointer; }
    button:hover { border-color: var(--acc); }
    button.big { background: #3a2f10; border-color: var(--acc); }
    #status { margin: 8px 0; color: var(--dim); }
    pre { background: #0b0b10; padding: 8px; max-height: 40vh; overflow: auto; white-space: pre-wrap; }
    .ok { color: var(--ok); } .bad { color: var(--bad); }
  </style>
</head>
<body>
  <h1>HIT PARADE - audio lab</h1>
  <div>Dev-only page (never linked from index.html). Click once to unlock audio, then play any cue. <code>window.__AUDIO_LAB__</code> drives it headless.</div>
  <div id="status">locked</div>
  <div class="row">
    <button class="big" id="b-decode">decode every asset (Ogg + AAC)</button>
    <button class="big" id="b-playall">play every sound + cue</button>
    <button class="big" id="b-bout">bout demo (events through createAudio)</button>
    <button id="b-stop">stop music</button>
  </div>
  <h2>music</h2><div class="row" id="music"></div>
  <h2>ui</h2><div class="row" id="ui"></div>
  <h2>announcer</h2><div class="row" id="announce"></div>
  <h2>sounds (click cycles variants)</h2><div class="row" id="sfx"></div>
  <h2>log</h2><pre id="log"></pre>
  <script type="module" src="../src/lab/audio.ts"></script>
</body>
</html>
