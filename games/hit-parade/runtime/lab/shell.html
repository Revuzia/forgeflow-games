<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIT PARADE lab: SHELL</title>
<style>
  html, body { margin: 0; background: #140d1f; color: #fff4e0; font: 13px/1.4 Consolas, monospace; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
  section { background: #0b0712; border: 2px solid #ffd23a; padding: 10px; }
  h1 { margin: 0 0 6px; font: italic 28px Impact, sans-serif; color: #ffd23a; }
  h2 { margin: 0 0 6px; font-size: 14px; color: #ff5a6e; }
  pre { margin: 0; white-space: pre-wrap; }
  .word { font-size: 18px; }
  #log { grid-column: 1 / 3; max-height: 30vh; overflow: auto; }
</style>
</head>
<body>
<main>
  <section><h1>SHELL LAB</h1><pre id="loop">loop: -</pre></section>
  <section><h2>input words</h2><pre id="words" class="word">-</pre></section>
  <section><h2>pads</h2><pre id="pads">-</pre></section>
  <section><h2>settings / save</h2><pre id="store">-</pre></section>
  <section id="log"><h2>log</h2><pre id="logtext"></pre></section>
</main>
<canvas id="game" width="16" height="16" style="position:fixed;right:0;bottom:0;width:16px;height:16px"></canvas>
<script type="module" src="../src/lab/shell.ts"></script>
</body>
</html>
