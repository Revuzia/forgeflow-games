<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HIT PARADE lab: NET</title>
<style>
  html, body { margin: 0; background: #140d1f; color: #fff4e0; font: 13px/1.4 Consolas, monospace; }
  main { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; padding: 12px; }
  section { background: #0b0712; border: 2px solid #ffd23a; padding: 10px; min-width: 0; }
  h1 { margin: 0 0 6px; font: italic 28px Impact, sans-serif; color: #ffd23a; }
  h2 { margin: 0 0 6px; font-size: 14px; color: #ff5a6e; }
  pre { margin: 0; white-space: pre-wrap; word-break: break-all; }
  button, input { font: inherit; background: #221634; color: #fff4e0; border: 1px solid #ffd23a; padding: 4px 8px; }
  #log { grid-column: 1 / 3; max-height: 40vh; overflow: auto; }
  .ok { color: #7dff9a; } .bad { color: #ff5a6e; }
</style>
</head>
<body>
<main>
  <section>
    <h1>NET LAB</h1>
    <div id="controls">
      <button id="create">CREATE ROOM</button>
      <input id="code" placeholder="ROOM CODE" size="10">
      <button id="join">JOIN</button>
      <button id="quick">QUICK MATCH</button>
      <button id="leave">LEAVE</button>
    </div>
    <pre id="link"></pre>
    <pre id="phase">phase: idle</pre>
  </section>
  <section><h2>session</h2><pre id="stats">-</pre></section>
  <section id="log"><h2>log</h2><pre id="logtext"></pre></section>
</main>
<script type="module" src="../src/lab/net.ts"></script>
</body>
</html>
