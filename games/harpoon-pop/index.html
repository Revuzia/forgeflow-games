<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Harpoon Pop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Chakra+Petch:wght@500;700&display=swap">
<style>
/* Layout: one arcade cabinet screen, centred, scaled to fit; touch pad below on phones.
   Two stacked canvases: WebGL world (Three.js) underneath, crisp 2D HUD/text on top.
   Deliberately single-theme (night arcade), so colours are set explicitly on :root. */
:root {
  --bg: #0b0716;
  --panel: #160f2b;
  --fg: #efe9ff;
  --muted: #9a8fc0;
  --accent: #ff3d8b;
  --cyan: #3fe0ff;
  --display: "Bungee", "Impact", "Arial Black", sans-serif;
  --ui: "Chakra Petch", "Segoe UI", system-ui, sans-serif;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--ui);
  margin: 0; padding-inline: 16px; box-sizing: border-box; overflow: hidden;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 12px;
}
#stage { position: relative; width: 100%; max-width: calc((100vh - 40px) * 16 / 9); max-width: calc((100dvh - 40px) * 16 / 9); aspect-ratio: 16 / 9; background: #07040f; border-radius: 6px; overflow: hidden; box-shadow: 0 0 0 1px #2a1f4d, 0 20px 60px -20px #000; }
/* phones / tablets (html.ffg-touch is set by game_controls.js): the game fills the screen edge to edge */
html.ffg-touch body { padding-inline: 0; gap: 0; }
html.ffg-touch #stage { max-width: calc(100vh * 16 / 9); max-width: calc(100dvh * 16 / 9); border-radius: 0; box-shadow: none; }
html.lobby-open #__ffg_touch__ { display: none; }
/* portrait phone: ask for landscape (dismissable) */
#rotate { display: none; }
html.ffg-touch.ffg-portrait #rotate:not(.dismissed) { display: grid; position: fixed; inset: 0; z-index: 2147483000; place-items: center; padding: 24px; background: rgba(11, 7, 22, 0.92); text-align: center; }
#rotate .rt-card { display: grid; gap: 14px; justify-items: center; max-width: 320px; }
#rotate .rt-icon { width: 64px; height: 104px; border: 4px solid var(--cyan); border-radius: 14px; animation: rt-turn 2.4s ease-in-out infinite; }
@keyframes rt-turn { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
@media (prefers-reduced-motion: reduce) { #rotate .rt-icon { animation: none; transform: rotate(-90deg); } }
#rotate h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: 22px; color: var(--fg); }
#rotate p { margin: 0; color: var(--muted); font-size: 15px; }
#rotate button { font-family: var(--display); font-size: 14px; color: var(--muted); background: transparent; border: 2px solid #3a2c6b; border-radius: 10px; padding: 10px 16px; }
.lb-invite { display: grid; gap: 6px; }
.lb-invite code { font-size: 12px; color: var(--muted); word-break: break-all; user-select: all; -webkit-user-select: all; }
#stage canvas { position: absolute; inset: 0; display: block; width: 100%; height: 100%; outline: none; touch-action: none; }
#hud:focus-visible { box-shadow: inset 0 0 0 2px var(--cyan); }
#boot { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--display); color: var(--muted); font-size: clamp(14px, 2.4vw, 22px); text-align: center; padding: 16px; }
/* online lobby (DOM so it works with keyboard, mouse and touch) */
#lobby { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 16px; background: rgba(11, 7, 22, 0.78); }
.lb-card { width: min(440px, 100%); display: grid; gap: 12px; padding: 22px; text-align: center; background: var(--panel); border: 2px solid #3a2c6b; border-radius: 16px; box-shadow: 0 20px 60px -20px #000; }
.lb-card h2 { margin: 0; font-family: var(--display); font-weight: 400; font-size: clamp(20px, 4vw, 28px); color: var(--cyan); }
.lb-sub { margin: 0; color: var(--muted); font-size: 14px; }
.lb-row { display: flex; gap: 10px; }
.lb-row > * { flex: 1; min-width: 0; }
.lb-card button { font-family: var(--display); font-size: 15px; color: var(--fg); background: #241a44; border: 2px solid #4a3a85; border-radius: 10px; padding: 12px 10px; cursor: pointer; }
.lb-card button:hover, .lb-card button:focus-visible { border-color: var(--cyan); outline: none; }
.lb-card button.primary { border-color: var(--accent); background: #3a1530; }
.lb-card button:disabled, #lbCode:disabled { opacity: 0.5; cursor: default; }
#lbCode { font-family: var(--display); font-size: 18px; letter-spacing: 0.3em; text-align: center; text-transform: uppercase; color: var(--fg); background: #0f0a20; border: 2px solid #4a3a85; border-radius: 10px; padding: 10px; }
#lbCode:focus-visible { outline: none; border-color: var(--cyan); }
.lb-room { font-family: var(--display); font-size: 44px; letter-spacing: 0.25em; color: var(--accent); }
.lb-status { margin: 0; min-height: 2.8em; font-size: 14px; color: var(--fg); }
.lb-status.err { color: #ff8a9a; }
.lb-card .lb-back { background: transparent; border-color: transparent; color: var(--muted); }

</style>

<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<script type="module">
/* =====================================================================
   HARPOON POP — a Pang / Buster Bros. / Bubble Trouble style arcade game
   Rendered with Three.js (r160): PBR iridescent bubbles, shadows, bloom,
   GPU particles, post-FX. Game logic is renderer-independent (2D coords).
   ---------------------------------------------------------------------
   File map (mirrors the build steps):
     §0  Config & tuning tables       (sizes, items, levels — extend here)
     §1  Utilities
     §2  Audio (Web Audio synth SFX + sequenced music)
     §3  Input (keyboard + touch)
     §4  Game state & level loading
     §5  Player + weapons (wire / double / power wire / gun)
     §6  Bubbles: physics, splitting, bombs, chain reactions
     §6b Enemies: Stinger drone that telegraphs and shoots back
     §7  Collisions, lives, near-miss, level clear, timer
     §8  Power-ups
     §9  Juice: particles, popups, shake, hitstop, slow-mo
     §10 2D layer: backdrop painter, HUD, text, menus
     §13 Online co-op: lobby, quick match, rooms, P2P + relay netcode (after §11)
     §11 3D layer: Three.js scene, procedural hero + drone rigs, particles, post-processing
     §12 Main loop & boot
   Coordinates: all gameplay runs in a 960×540 "game space" (y down).
   The 3D world maps 1 game px = 1 world unit on the z=0 plane.
   Everything is original and generated in code: the hero and drone are modelled from Three.js
   geometry, backdrops are painted procedurally, and all music and SFX are synthesised live.
   The page loads no asset files at all (only three.js from jsDelivr and two Google Fonts).
   ===================================================================== */
import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';
/* ============================ §0 CONFIG ============================ */
const W = 960, H = 540;                       // logical resolution
const ARENA = { l: 20, r: 940, t: 52, b: 492 }; // play-field walls / ceiling / floor
const G = 980;                                 // gravity px/s²
const STEP = 1 / 120;                          // fixed physics step
const PLAYER_SPEED = 300;
const HARPOON_SPEED = 960;
const BULLET_SPEED = 1150;
const COMBO_WINDOW = 1.4;                      // seconds between pops to keep a combo alive
const BASE_VX = 118;                           // bubble horizontal speed

// Bubble sizes, smallest first. h = fixed bounce height above the floor (classic Pang rule).
const SIZES = [
  { r: 10, h: 105, score: 300, color: '#7cff6b', hitstop: 0.000, shake: 0.06 },
  { r: 17, h: 155, score: 200, color: '#3fe0ff', hitstop: 0.025, shake: 0.10 },
  { r: 28, h: 210, score: 150, color: '#ffd23f', hitstop: 0.040, shake: 0.18 },
  { r: 42, h: 260, score: 100, color: '#ff8a3d', hitstop: 0.055, shake: 0.28 },
  { r: 58, h: 300, score:  50, color: '#ff3d8b', hitstop: 0.070, shake: 0.38 },
];
const SIZE_NAMES = ['TINY', 'SMALL', 'MEDIUM', 'LARGE', 'HUGE'];

// Power-ups. weight = relative drop chance. Add a new one here + a case in applyItem() + drawItemIcon().
const ITEMS = {
  double: { color: '#3fe0ff', weight: 20, label: 'DOUBLE WIRE' },
  power:  { color: '#ffd23f', weight: 18, label: 'POWER WIRE' },
  gun:    { color: '#ff8a3d', weight: 15, label: 'RAPID FIRE' },
  slow:   { color: '#9d86ff', weight: 14, label: 'SLOW-MO' },
  shield: { color: '#7cff6b', weight: 14, label: 'FORCE FIELD' },
  dyna:   { color: '#ff4b3a', weight: 8,  label: 'DYNAMITE' },
  life:   { color: '#ff3d8b', weight: 5,  label: '1UP' },
};
const DROP_CHANCE = 0.16;
// Flying "Stinger" enemy that shoots back (appears from stage 3)
const ENEMY = { r: 22, speed: 95, score: 1000, firstStage: 3 };

// Backdrop palettes (sky top, sky bottom, sun, far ridge, near ridge)
const PALETTES = [
  { top: '#1a0b2e', bot: '#ff7a59', sun: '#ffe0a8', far: '#4a1d4f', near: '#1f0e2b' },
  { top: '#061c26', bot: '#2fa58a', sun: '#e9ffd0', far: '#0f4a46', near: '#062027' },
  { top: '#120a33', bot: '#6a4bd1', sun: '#f0e1ff', far: '#2f1f6b', near: '#120c2c' },
  { top: '#1d1205', bot: '#d98b2b', sun: '#fff0c2', far: '#5a3510', near: '#201104' },
  { top: '#2a0d0d', bot: '#ff5a36', sun: '#ffe1b0', far: '#6e1f17', near: '#260a09' },
  { top: '#0a1630', bot: '#5fa8ff', sun: '#fff4e0', far: '#1f3f78', near: '#0b1734' },
];

/* Level table. bubbles: [size, x, dir, kind?]   plats: [x, y, w, h, 'solid'|'glass']
   Glass wider than 100px is auto-cut into breakable tiles. Past the table, stages are generated. */
const LEVELS = [
  { name: 'MT. FUJI',       land: 'fuji',     pal: 0, time: 60,  bubbles: [[3, 300, 1]], plats: [] },
  { name: 'GUILIN',         land: 'karst',    pal: 1, time: 70,  bubbles: [[4, 480, 1]], plats: [] },
  { name: 'EMERALD TEMPLE', land: 'temple',   pal: 2, time: 80,  bubbles: [[3, 220, 1], [3, 740, -1]], plats: [[420, 250, 120, 18, 'glass']] },
  { name: 'ANGKOR WAT',     land: 'temple',   pal: 3, time: 80,  bubbles: [[4, 300, 1], [1, 700, -1], [1, 780, -1]], plats: [[170, 300, 130, 18, 'solid'], [660, 300, 130, 18, 'solid']] },
  { name: 'AYERS ROCK',     land: 'mesa',     pal: 4, time: 85,  bubbles: [[3, 200, 1, 'bomb'], [3, 480, -1], [3, 760, 1]], plats: [] },
  { name: 'TAJ MAHAL',      land: 'dome',     pal: 5, time: 90,  bubbles: [[4, 240, 1], [4, 720, -1]], plats: [[420, 230, 120, 18, 'glass']] },
  { name: 'LENINGRAD',      land: 'dome',     pal: 2, time: 90,  bubbles: [[2, 140, 1], [2, 300, -1], [2, 460, 1], [2, 620, -1], [2, 800, 1, 'bomb']], plats: [[90, 330, 160, 18, 'glass'], [710, 330, 160, 18, 'glass']] },
  { name: 'PARIS',          land: 'skyline',  pal: 0, time: 95,  bubbles: [[4, 480, 1, 'bomb'], [3, 200, -1], [3, 760, 1]], plats: [[290, 280, 110, 18, 'solid'], [560, 280, 110, 18, 'solid']] },
  { name: 'LONDON',         land: 'skyline',  pal: 5, time: 100, bubbles: [[4, 220, 1], [4, 740, -1], [2, 480, 1, 'bomb']], plats: [[180, 270, 600, 16, 'glass']] },
  { name: 'BARCELONA',      land: 'skyline',  pal: 3, time: 100, bubbles: [[3, 160, 1], [3, 380, -1], [3, 580, 1, 'bomb'], [3, 800, -1]], plats: [[100, 300, 100, 18, 'solid'], [430, 230, 100, 18, 'solid'], [760, 300, 100, 18, 'solid']] },
  { name: 'ATHENS',         land: 'temple',   pal: 1, time: 110, bubbles: [[4, 300, 1], [4, 660, -1], [3, 480, 1, 'bomb']], plats: [[60, 250, 240, 16, 'glass'], [660, 250, 240, 16, 'glass']] },
  { name: 'GIZA',           land: 'pyramids', pal: 4, time: 120, bubbles: [[4, 200, 1, 'bomb'], [4, 480, -1], [4, 760, 1]], plats: [[340, 300, 280, 16, 'glass']] },
];
const BONUS_NAMES = ['KENYA', 'NEW YORK', 'MAYA', 'ANTARCTICA', 'EASTER ISLAND', 'KYOTO', 'RIO', 'PETRA'];
const BONUS_LANDS = ['mesa', 'skyline', 'temple', 'karst', 'fuji', 'dome', 'skyline', 'pyramids'];

/* ============================ §1 UTILITIES ============================ */
const rand = (a, b) => a + Math.random() * (b - a);
const clamp = (v, a, b) => (v < a ? a : v > b ? b : v);
const approach = (v, t, d) => (v < t ? Math.min(v + d, t) : Math.max(v - d, t));
const bounceV = (size) => Math.sqrt(2 * G * SIZES[size].h);
function mulberry32(a) { return () => { a |= 0; a = (a + 0x6d2b79f5) | 0; let t = Math.imul(a ^ (a >>> 15), 1 | a); t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t; return ((t ^ (t >>> 14)) >>> 0) / 4294967296; }; }
function hashStr(s) { let h = 2166136261; for (const c of s) h = Math.imul(h ^ c.charCodeAt(0), 16777619); return h >>> 0; }
function shade(hex, amt) { // amt -1..1 : darken / lighten
  const n = parseInt(hex.slice(1), 16); let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  r = Math.round(r + (t - r) * p); g = Math.round(g + (t - g) * p); b = Math.round(b + (t - b) * p);
  return `rgb(${r},${g},${b})`;
}
function rgba(hex, a) { const n = parseInt(hex.slice(1), 16); return `rgba(${n >> 16},${(n >> 8) & 255},${n & 255},${a})`; }
function circleRectDist(cx, cy, rx, ry, rw, rh) { const nx = clamp(cx, rx, rx + rw), ny = clamp(cy, ry, ry + rh); return Math.hypot(cx - nx, cy - ny); }
function pickWeighted(table) { let tot = 0; for (const k in table) tot += table[k].weight; let r = Math.random() * tot; for (const k in table) { r -= table[k].weight; if (r <= 0) return k; } return Object.keys(table)[0]; }
const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;
function store(key, val) { try { if (val === undefined) return JSON.parse(localStorage.getItem(key)); localStorage.setItem(key, JSON.stringify(val)); } catch (e) { return null; } }

/* ============================ §2 AUDIO ============================ */
/* Audio: 100% original and generated at runtime — no sample or music files.
   • SFX are synthesised (oscillators, filtered noise, FM).
   • Music is original compositions (SONGS below) played by a small synth band: drums, bass,
     detuned-saw pads, plucked arps, a vibrato lead and an FM bell, through a generated
     convolution reverb and a tempo-synced delay. Bullet-time low-passes the music bus. */
const Sound = (() => {
  let ctx = null, master, sfxBus, musBus, musFilter, analyser, noiseBuf, revIn, delIn, delNode, muted = false, musicOn = true;
  const MUSIC_VOL = 0.16; // music sits under the SFX (measured: music RMS ≈ pops RMS or lower)
  let ducked = false, muffle = 1, trans = 0, tempoMul = 1, wantTrack = null;
  const last = {};

  function init() {
    if (ctx) { if (ctx.state === 'suspended') ctx.resume(); return; }
    const AC = window.AudioContext || window.webkitAudioContext; if (!AC) return;
    ctx = new AC();
    const comp = ctx.createDynamicsCompressor(); comp.threshold.value = -12; comp.ratio.value = 4; comp.attack.value = 0.004; comp.release.value = 0.2;
    master = ctx.createGain(); master.gain.value = muted ? 0 : 0.85;
    sfxBus = ctx.createGain();
    musBus = ctx.createGain(); musBus.gain.value = musicOn ? MUSIC_VOL : 0;
    musFilter = ctx.createBiquadFilter(); musFilter.type = 'lowpass'; musFilter.frequency.value = 20000; musFilter.Q.value = 0.8;
    analyser = ctx.createAnalyser(); analyser.fftSize = 1024;
    // shared space for the band: generated-impulse reverb + dotted-eighth feedback delay
    const rev = ctx.createConvolver(); rev.buffer = impulse(2.6, 3.2);
    revIn = ctx.createGain(); const revOut = ctx.createGain(); revOut.gain.value = 0.8;
    revIn.connect(rev); rev.connect(revOut); revOut.connect(musBus);
    delIn = ctx.createGain(); delNode = ctx.createDelay(1.5); delNode.delayTime.value = 0.33;
    const fb = ctx.createGain(); fb.gain.value = 0.32; const dlp = ctx.createBiquadFilter(); dlp.type = 'lowpass'; dlp.frequency.value = 2600;
    const delOut = ctx.createGain(); delOut.gain.value = 0.4;
    delIn.connect(delNode); delNode.connect(dlp); dlp.connect(fb); fb.connect(delNode); dlp.connect(delOut); delOut.connect(musBus);
    sfxBus.connect(master); musBus.connect(musFilter); musFilter.connect(master); master.connect(comp); comp.connect(ctx.destination); comp.connect(analyser);
    noiseBuf = ctx.createBuffer(1, ctx.sampleRate, ctx.sampleRate);
    const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    setInterval(schedule, 25);
    if (wantTrack) { const w = wantTrack; wantTrack = null; playTrack(w); }
  }
  function impulse(sec, decay) {
    const n = Math.floor(ctx.sampleRate * sec), b = ctx.createBuffer(2, n, ctx.sampleRate);
    for (let c = 0; c < 2; c++) { const d = b.getChannelData(c); for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / n, decay); }
    return b;
  }

  /* ---------- SFX primitives ---------- */
  function env(g, t, a, d, peak) { g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(Math.max(peak, 0.0002), t + a); g.gain.exponentialRampToValueAtTime(0.0001, t + a + d); }
  function tone({ f = 440, f2 = null, type = 'sine', dur = 0.15, vol = 0.3, delay = 0, attack = 0.004, bus }) {
    if (!ctx) return; const t = ctx.currentTime + Math.max(0, delay);
    const o = ctx.createOscillator(), g = ctx.createGain(); o.type = type;
    o.frequency.setValueAtTime(f, t); if (f2) o.frequency.exponentialRampToValueAtTime(f2, t + attack + dur);
    env(g, t, attack, dur, vol); o.connect(g); g.connect(bus || sfxBus); o.start(t); o.stop(t + attack + dur + 0.05);
  }
  function noise({ dur = 0.2, vol = 0.3, freq = 2000, f2 = null, q = 1, type = 'bandpass', delay = 0, bus }) {
    if (!ctx) return; const t = ctx.currentTime + Math.max(0, delay);
    const s = ctx.createBufferSource(); s.buffer = noiseBuf;
    const f = ctx.createBiquadFilter(); f.type = type; f.Q.value = q; f.frequency.setValueAtTime(freq, t);
    if (f2) f.frequency.exponentialRampToValueAtTime(f2, t + dur);
    const g = ctx.createGain(); env(g, t, 0.003, dur, vol);
    s.connect(f); f.connect(g); g.connect(bus || sfxBus); s.start(t, Math.random() * 0.5); s.stop(t + dur + 0.05);
  }
  // FM bell: carrier + inharmonic modulator whose index decays — bright attack, glassy tail
  function fm({ f = 880, ratio = 3.5, index = 2, dur = 0.8, vol = 0.15, delay = 0, bus }) {
    if (!ctx) return; const t = ctx.currentTime + Math.max(0, delay);
    const c = ctx.createOscillator(), m = ctx.createOscillator(), mg = ctx.createGain(), g = ctx.createGain();
    c.frequency.value = f; m.frequency.value = f * ratio;
    mg.gain.setValueAtTime(f * index, t); mg.gain.exponentialRampToValueAtTime(1, t + dur);
    m.connect(mg); mg.connect(c.frequency); env(g, t, 0.002, dur, vol); c.connect(g); g.connect(bus || sfxBus);
    c.start(t); m.start(t); c.stop(t + dur + 0.05); m.stop(t + dur + 0.05);

// Every gameplay sound goes through this proxy: the host records it for the online guest, and on the

/* ============================ §3 INPUT ============================ */

const CONFIRM_KEYS = ['Space', 'Enter', 'KeyZ', 'KeyX', 'KeyJ'];
addEventListener('keydown', (e) => {

function onPress(code) {

  if (code === 'KeyN') { const m = Sound.toggleMusic(); toast(m ? 'MUSIC ON' : 'MUSIC OFF'); return; }

    if (Net.started) { toast('NO PAUSE ONLINE'); return; }
    if (['play', 'paused', 'intro'].includes(game.state)) togglePause(); return;
  }
  if (game.state === 'title') { // mode picker: 1 PLAYER · ONLINE CO-OP · LOCAL 2P
    const modes = titleModes();
    if (code === 'ArrowLeft' || code === 'KeyA') { game.modeSel = modes[(modes.indexOf(game.modeSel) + modes.length - 1) % modes.length]; sfx.tick(false); return; }
    if (code === 'ArrowRight' || code === 'KeyD') { game.modeSel = modes[(modes.indexOf(game.modeSel) + 1) % modes.length]; sfx.tick(false); return; }

}
const isTouch = () => !!(window.FFG_DEVICE ? window.FFG_DEVICE.touch : matchMedia('(pointer: coarse)').matches);
const titleModes = () => (isTouch() ? [1, 2] : [1, 2, 3]);
const MODE_LABELS = { 1: '1 PLAYER', 2: 'ONLINE CO-OP', 3: 'LOCAL 2P' };
function confirmAction(fromPeer) {
  Sound.init();

  if (Net.role === 'guest' && Net.started) { if (s === 'clear' || s === 'gameover') sendRel('confirm', {}); return; } // the host advances the shared game
  if (s === 'title') {
    sfx.select();
    if (game.modeSel === 2) openLobby();
    else newGame(game.modeSel === 3 && !isTouch());
  }

// Touch play: the shared control layer (game_controls.js) draws a thumbstick + FIRE button that send

window.__PAUSE__ = {
  toggle() { if (!Net.started && ['play', 'paused', 'intro'].includes(game.state)) togglePause(); },
  pause() { if (!Net.started && (game.state === 'play' || game.state === 'intro')) togglePause(); },
};
// leaving the tab / app: pause an offline game and silence audio until the player is back
document.addEventListener('visibilitychange', () => {

  else Sound.resume();

document.getElementById('rtDismiss').addEventListener('click', () => document.getElementById('rotate').classList.add('dismissed'));

/* ============================ §4 GAME STATE ============================ */
const game = {
  state: 'title', stateT: 0, realT: 0,
  level: 1, def: null, score: 0,
  players: [], coop: false, modeSel: 1, credit: 0, bubbles: [], harpoons: [], bullets: [], items: [], platforms: [], pending: [],
  enemies: [], shots: [], enemyT: 0, contT: 0, fireworks: [], shotId: 0,
  particles: [], texts: [], banner: null, toastMsg: null,
  slowT: 0, dynaOwner: 0, uid: 0, epoch: 0,
  slowmoT: 0, timeScale: 1, hitstop: 0, shake: 0, flash: 0, flashColor: '#fff',
  combo: 0, comboT: 0, nearCd: 0, timeLeft: 0, lastTick: 99, dyna: 0, dynaCd: 0,
  backdrop: null, stats: freshStats(), clearInfo: null, scores: store('harpoonpop.scores') || [],
};
// Per-player state lives on the player objects. These aliases point at P1 so single-player code
// paths, tools and the test harness can keep reading game.player / game.lives / game.weapon / ...
Object.defineProperty(game, 'player', { get() { return game.players[0] || null; } });
for (const k of ['lives', 'weapon', 'shield', 'invuln', 'gunCd']) {
  Object.defineProperty(game, k, { get() { return game.players[0] ? game.players[0][k] : undefined; }, set(v) { if (game.players[0]) game.players[0][k] = v; } });
}
const alivePlayers = () => game.players.filter((p) => !p.dead && !p.out);
function freshStats() { return { pops: 0, bestCombo: 0, apex: 0, juggles: 0, close: 0, chains: 0, stingers: 0 }; }

function getLevelDef(n) {
  if (n <= LEVELS.length) return LEVELS[n - 1];
  // Generated "world tour+" stages: more and bigger bubbles, random glass shelves
  const R = mulberry32(n * 9973), i = (n - LEVELS.length - 1) % BONUS_NAMES.length;
  const count = Math.min(5, 2 + Math.floor((n - LEVELS.length) / 3));
  const bubbles = [], plats = [];
  for (let k = 0; k < count; k++) bubbles.push([R() < 0.6 ? 4 : 3, 120 + (720 / Math.max(1, count - 1)) * k, k % 2 ? -1 : 1, R() < 0.3 ? 'bomb' : undefined]);
  const np = Math.floor(R() * 3);
  for (let k = 0; k < np; k++) plats.push([80 + R() * 680, 220 + R() * 120, 100 + R() * 160, 16, R() < 0.7 ? 'glass' : 'solid']);
  return { name: BONUS_NAMES[i] + (n > LEVELS.length + BONUS_NAMES.length ? ' II' : ''), land: BONUS_LANDS[i], pal: n % PALETTES.length, time: 110, bubbles, plats };
}
const speedMul = () => 1 + Math.min(0.35, (game.level - 1) * 0.025);

function makeBubble(size, x, y, dir, opts = {}) {
  return {
    size, x, y, r: SIZES[size].r, vx: dir * BASE_VX * speedMul() * (opts.fast ? 1 + (4 - size) * 0.06 : 1),
    vy: opts.vy || 0, kind: opts.kind || 'normal', age: 0, fromSplit: !!opts.fromSplit,
    squash: 0, squashAxis: 0, dead: false, nearDone: false, wob: Math.random() * 6, id: ++game.uid,
  };
}
function makePlayer(id, lives) {
  return {
    id, x: game.coop ? (id ? 600 : 360) : W / 2, vx: 0, face: id ? -1 : 1, run: 0, shootT: 0, land: 0,
    dead: false, out: false, deadT: 0, dx: 0, dy: 0, dvx: 0, dvy: 0, rot: 0,
    lives, weapon: 'wire', shield: false, invuln: 0, gunCd: 0, shotId: 0, points: 0,

function newGame(coop = false) {
  game.coop = coop; game.players = coop ? [makePlayer(0, 3), makePlayer(1, 3)] : [makePlayer(0, 3)];
  game.score = 0; game.level = 1; game.stats = freshStats();

}
function loadLevel(n) {
  game.level = n; game.def = getLevelDef(n);

  Sound.setRoot([0, 3, -2, 5, 2, -4, 7][n % 7]); Sound.setTempo(1 + Math.min(0.08, (n - 1) * 0.006));

}
// (Re)builds the stage from its definition — used on load and after losing a life (classic Pang restarts the stage).
function resetStage() {
  const def = game.def;
  game.bubbles = def.bubbles.map(([s, x, d, kind]) => makeBubble(s, x, ARENA.t + SIZES[s].r + 50, d, { kind }));
  game.platforms = buildPlatforms(def);
  game.epoch++;
  game.harpoons = []; game.bullets = []; game.items = []; game.pending = [];
  game.enemies = []; game.shots = []; game.enemyT = rand(7, 11);
  // every player with lives left (re)spawns with fresh gear; lives and points carry over
  game.players = game.players.map((p) => Object.assign(makePlayer(p.id, p.lives), { points: p.points, out: p.lives <= 0 }));

  game.slowmoT = 0; game.timeScale = 1;

// Stage ledges from a level definition; long glass is cut into breakable tiles. ids are stable per stage.

  const out = [];
  for (const [x, y, w, h, kind] of def.plats) {
    if (kind === 'glass' && w > 100) { const n = Math.ceil(w / 80), tw = w / n; for (let i = 0; i < n; i++) out.push({ x: x + i * tw, y, w: tw, h, kind }); }
    else out.push({ x, y, w, h, kind });

function nextLevel() { sfx.select(); loadLevel(game.level + 1); }
function toTitle() { if (Net.role) netEnd(); setState('title'); Sound.playMusic(true); Sound.playTrack('menu'); seedTitle(); }
// Music per stage: two alternating stage themes, the boss theme every 4th stage.
const trackFor = (n) => (n % 4 === 0 ? 'boss' : n % 2 ? 'stage1' : 'stage2');
// Arcade-style CONTINUE: same stage, 3 fresh lives, score back to zero.

/* ============================ §5 PLAYER + WEAPONS ============================ */
function updatePlayers(dt) { for (const p of alivePlayers()) updatePlayer(p, dt); }
function updatePlayer(p, dt) {

    const r = Net.peerIn;
    if (r.ep === game.epoch) { p.x += (clamp(r.x, ARENA.l + 14, ARENA.r - 14) - p.x) * Math.min(1, dt * 20); p.vx = r.vx; p.face = r.face || p.face; }

// left/right movement for one diver (also used by the online guest to predict its own diver)
function movePlayer(p, c, dt) {
  const dir = (c.right ? 1 : 0) - (c.left ? 1 : 0);
  // Snappy accel/decel: reaches top speed in ~0.06s, stops in ~0.04s
  p.vx = approach(p.vx, dir * PLAYER_SPEED, (dir ? 5200 : 7500) * dt);
  p.x += p.vx * dt;
  if (p.x < ARENA.l + 14) { p.x = ARENA.l + 14; p.vx = 0; }
  if (p.x > ARENA.r - 14) { p.x = ARENA.r - 14; p.vx = 0; }

}

function tryFire(p) {
  if (p.weapon === 'gun') {
    const mine = game.bullets.filter((u) => u.owner === p.id).length;
    if (p.gunCd > 0 || mine >= 8) return;
    const side = (mine % 2 ? 1 : -1) * 5;
    game.bullets.push({ x: p.x + side, y: ARENA.b - 50, dead: false, owner: p.id }); p.shotId++; game.shotId++;
    p.gunCd = 0.085; p.shootT = 0.12; sfx.gun();
    fx('muzzle', p.x + side, 1);
    return;
  }
  const max = { double: 2, triple: 3 }[p.weapon] || 1;
  if (game.harpoons.filter((h) => h.owner === p.id).length >= max) return;
  game.harpoons.push({ id: ++game.uid, x: p.x, tip: ARENA.b - 46, state: 'rise', stuckT: 0, kind: p.weapon === 'power' ? 'power' : 'wire', dead: false, owner: p.id });
  p.shotId++; game.shotId++;
  p.shootT = 0.2; sfx.shoot();
  fx('muzzle', p.x, 0);
}

// The lowest obstacle (platform underside or the ceiling) above x — what a wire/bullet will hit first.
function ceilingAt(x) {
  let y = ARENA.t, plat = null;
  for (const pl of game.platforms) if (x >= pl.x - 2 && x <= pl.x + pl.w + 2 && pl.y + pl.h > y) { y = pl.y + pl.h; plat = pl; }
  return { y, plat };

function updateWeapons(dt) {
  for (const h of game.harpoons) {
    // crackling energy along the whole wire
    if (Math.random() < 0.5) spawn({ x: h.x + rand(-3, 3), y: rand(h.tip, ARENA.b), vx: rand(-50, 50), vy: rand(-50, 50), life: 0.22, size: rand(1, 2.2), color: h.kind === 'power' ? '#ffd23f' : '#9fdcff', type: 'spark' });
    game.credit = h.owner;
    if (h.state === 'rise') {
      h.tip -= HARPOON_SPEED * dt;
      if (Math.random() < 0.6) spawn({ x: h.x + rand(-2, 2), y: h.tip + rand(0, 10), vx: rand(-30, 30), vy: rand(20, 80), life: 0.3, size: rand(1, 2.5), color: h.kind === 'power' ? '#ffd23f' : '#bfe9ff', type: 'spark' });
      const c = ceilingAt(h.x);
      if (h.tip <= c.y) {

        else if (h.kind === 'power') { h.state = 'stuck'; h.stuckT = 3.2; sfx.clink(); }

    }

      if (Math.hypot(b.x - h.x, b.y - cy) < b.r) { hitBubble(b, 'wire', h.x, cy); h.dead = true; break; }
    }

  }

  for (const u of game.bullets) {
    game.credit = u.owner;
    u.y -= BULLET_SPEED * dt;

/* ============================ §6 BUBBLES ============================ */
function updateBubbles(dt) {

    b.squash = Math.max(0, b.squash - dt * 5);
    if (b.x - b.r < ARENA.l) { b.x = ARENA.l + b.r; b.vx = Math.abs(b.vx); wallHit(b, 1); }
    if (b.x + b.r > ARENA.r) { b.x = ARENA.r - b.r; b.vx = -Math.abs(b.vx); wallHit(b, -1); }
    if (b.y - b.r < ARENA.t) { b.y = ARENA.t + b.r; b.vy = Math.abs(b.vy) * 0.9; b.squash = 0.6; b.squashAxis = 0; }
    if (b.y + b.r > ARENA.b) {
      b.y = ARENA.b - b.r; b.vy = -bounceV(b.size); b.squash = 1; b.squashAxis = 0;
      if (b.size >= 3) { sfx.bounce(b.size); addShake(0.04 * b.size); }
      for (let i = 0; i < 2 + b.size; i++) spawn({ x: b.x + rand(-b.r * 0.6, b.r * 0.6), y: ARENA.b - 1, vx: rand(-90, 90), vy: rand(-90, -20), life: 0.3, size: rand(1.5, 3), color: '#cbbcff', g: 400 });
    }
    for (const pl of game.platforms) {

      let dx = b.x - cx, dy = b.y - cy, d = Math.hypot(dx, dy);

        else b.vy = Math.abs(b.vy);

}

// Core hit: score, combo, bonuses, VFX, split, drops. src: wire | gun | chain | dyna
function hitBubble(b, src, hx, hy) {

  if (src !== 'dyna' && src !== 'chain' && Math.abs(b.vy) < 85 && b.age > 0.3) { bonus *= 2; tags.push('APEX ×2'); st.apex++; sfx.apex(); }
  if (b.fromSplit && b.age < 0.5 && (src === 'wire' || src === 'gun')) { bonus *= 1.5; tags.push('JUGGLE'); st.juggles++; }
  if (src === 'chain') { tags.push('CHAIN'); st.chains++; }
  if (src === 'dyna') bonus *= 0.5;
  const pts = Math.round((S.score * mult * bonus) / 10) * 10;
  addScore(pts);
  popup(b.x, b.y - b.r * 0.3, '+' + pts, mult > 1 ? '#ffd23f' : '#ffffff', 18 + b.size * 3);
  tags.forEach((t, i) => popup(b.x, b.y - b.r - 14 - i * 18, t, t === 'CHAIN' ? '#ff4b3a' : '#3fe0ff', 16));
  if (game.combo >= 2) sfx.combo(game.combo);
  if (game.combo === 5 || game.combo === 10 || game.combo === 20) banner(`${game.combo} COMBO!`, `×${comboMult()} multiplier`, 0.9, '#ff3d8b', true);

  popFx(b, hx, hy);
  sfx.pop(b.size);
  game.hitstop = Math.max(game.hitstop, src === 'dyna' || src === 'gun' ? S.hitstop * 0.4 : S.hitstop);
  addShake(S.shake);

  // Split: two children pop upward and outward, a touch faster than the parent
  if (b.size > 0) {
    const ns = b.size - 1, r = SIZES[ns].r, vy = -Math.max(bounceV(ns) * 0.62, 330);
    for (const d of [-1, 1]) {
      const kid = makeBubble(ns, clamp(b.x + d * r * 0.6, ARENA.l + r, ARENA.r - r), Math.min(b.y, ARENA.b - r - 1), d, { vy, fromSplit: true, fast: true });
      kid.squash = 1;
      game.bubbles.push(kid);
    }
  }
  if (b.kind === 'bomb') explode(b.x, b.y, 120 + b.r);
  if (src !== 'dyna' && Math.random() < DROP_CHANCE) dropItem(b.x, b.y);

  // Last bubble: big slow-motion finish
  if (!game.bubbles.some((o) => !o.dead) && !game.pending.length) { game.slowmoT = 0.6; game.hitstop = 0.12; addShake(0.5); flash('#ffffff', 0.35); }
}
const comboMult = () => Math.min(8, 1 + Math.floor(Math.max(0, game.combo - 1) / 3)); // ×1 when no combo is running

// Bomb bubbles detonate and queue hits on everything nearby → chain reactions
function explode(x, y, radius) {
  sfx.boom(); addShake(0.55); flash('#ff6a3d', 0.25);
  fx('explode', x, y, radius);
  for (const o of game.bubbles) {
    if (o.dead) continue;
    const d = Math.hypot(o.x - x, o.y - y) - o.r;
    if (d < radius && !game.pending.some((p) => p.b === o)) game.pending.push({ b: o, t: 0.06 + Math.max(0, d) / 1600, credit: game.credit });
  }
}
function updatePending(dt) {
  for (const p of game.pending) { p.t -= dt; if (p.t <= 0) { game.credit = p.credit; if (!p.b.dead) hitBubble(p.b, 'chain', p.b.x, p.b.y); p.done = true; } }
  game.pending = game.pending.filter((p) => !p.done);
}

/* ============================ §6b ENEMIES ============================ */
// "Stinger" (from stage 3): flies in near the ceiling, flashes red to telegraph, then lobs a
// stinger at where you stand. A wire or bullet kills it; a wire also blocks stingers.
function maybeSpawnEnemy(dt) {
  if (game.level < ENEMY.firstStage) return;
  game.enemyT -= dt; if (game.enemyT > 0) return;
  const maxE = game.level >= 8 ? 2 : 1;
  if (game.enemies.length >= maxE) { game.enemyT = 2; return; }
  const dir = Math.random() < 0.5 ? 1 : -1, y = rand(ARENA.t + 55, ARENA.t + 115);
  game.enemies.push({ id: ++game.uid, x: dir > 0 ? ARENA.l - 40 : ARENA.r + 40, y, baseY: y, dir, t: rand(0, 6), fireT: rand(1.0, 1.8), charge: 0, dying: 0, vy: 0, dead: false });
  game.enemyT = Math.max(7, rand(15, 22) - game.level * 0.5);
  sfx.enemyIn();
}
function updateEnemies(dt) {
  const live = alivePlayers();
  for (const e of game.enemies) {
    if (e.dying) { e.dying += dt; e.vy += G * 0.7 * dt; e.y += e.vy * dt; e.x += e.dir * 30 * dt; if (e.y > ARENA.b + 60) e.dead = true; continue; }
    e.t += dt;
    const sp = e.charge > 0 ? 0.2 : 1; // hovers while charging
    e.x += e.dir * ENEMY.speed * speedMul() * sp * dt;
    e.y = e.baseY + Math.sin(e.t * 2.6) * 16;
    if ((e.dir > 0 && e.x > ARENA.r + 50) || (e.dir < 0 && e.x < ARENA.l - 50)) { e.dead = true; continue; }
    if (e.charge > 0) { e.charge -= dt; if (e.charge <= 0) fireStinger(e); }
    else if ((e.fireT -= dt) <= 0 && e.x > ARENA.l + 40 && e.x < ARENA.r - 40 && live.length && game.state === 'play') { e.charge = 0.5; e.fireT = rand(1.8, 2.8); sfx.enemyCharge(); }
  }
  game.enemies = game.enemies.filter((e) => !e.dead);
  for (const s of game.shots) {
    s.vy += 300 * dt; s.x += s.vx * dt; s.y += s.vy * dt;
    if (Math.random() < 0.8) spawn({ x: s.x, y: s.y, vx: rand(-20, 20), vy: rand(-20, 20), life: 0.25, size: rand(1.5, 3), color: '#ff5a3a', type: 'spark' });
    if (s.y >= ARENA.b - 2 || s.x < ARENA.l || s.x > ARENA.r) {
      s.dead = true;
      fx('splash', s.x, Math.min(s.y, ARENA.b - 2));
      continue;
    }
    for (const h of game.harpoons) if (Math.abs(s.x - h.x) < 7 && s.y > h.tip) { s.dead = true; game.credit = h.owner; blockFx(s); break; }
    if (s.dead) continue;
    for (const p of live) if (!p.dead && p.invuln <= 0 && circleRectDist(s.x, s.y, p.x - 10, ARENA.b - 40, 20, 40) < 5) { s.dead = true; playerHit(p, { x: s.x }); break; }
  }
  game.shots = game.shots.filter((s) => !s.dead);
}
function fireStinger(e) {
  const live = alivePlayers(); if (!live.length) return;
  const p = live.reduce((a, q) => (Math.abs(q.x - e.x) < Math.abs(a.x - e.x) ? q : a)), T = 1.05, dx = p.x - e.x, dy = (ARENA.b - 22) - (e.y + 16);
  game.shots.push({ x: e.x, y: e.y + 16, vx: dx / T, vy: dy / T - 150 * T, dead: false }); // lands where you stood ~1s later
  sfx.enemyShot();
  fx('stingFire', e.x, e.y + 16);
}
function blockFx(s) {
  sfx.block(); const pts = 100 * comboMult(); addScore(pts); popup(s.x, s.y - 16, 'BLOCKED +' + pts, '#3fe0ff', 15);
  fx('block', s.x, s.y);
}
function killEnemy(e) {
  e.dying = 0.001; e.vy = -220;
  const pts = ENEMY.score * comboMult(); addScore(pts);
  popup(e.x, e.y - 24, 'STINGER DOWN +' + pts, '#ffd23f', 18);
  sfx.enemyDie(); addShake(0.3); game.hitstop = Math.max(game.hitstop, 0.06); flash('#ffd23f', 0.12);
  fx('enemyDie', e.x, e.y);
  if (Math.random() < 0.6) dropItem(e.x, e.y);
  game.stats.stingers++;
}

/* ============================ §7 COLLISIONS / RULES ============================ */
function checkPlayers() {
  for (const p of alivePlayers()) {
    const rx = p.x - 10, ry = ARENA.b - 40;
    for (const b of game.bubbles) {
      if (b.dead) continue;
      const d = circleRectDist(b.x, b.y, rx, ry, 20, 40);
      if (d < b.r * 0.94 && p.invuln <= 0) { playerHit(p, b); break; }
      // Near miss: a bubble grazes you → bullet-time + bonus (once per bubble)
      if (d < b.r + 15 && !b.nearDone && game.nearCd <= 0 && p.invuln <= 0) {
        b.nearDone = true; game.nearCd = 1.2; game.slowmoT = 0.45; game.stats.close++;
        game.credit = p.id; const pts = 250 * comboMult(); addScore(pts);
        popup(p.x, ARENA.b - 70, 'CLOSE! +' + pts, '#9d86ff', 20); sfx.near();
        fx('near', p.x);
      }
    }
  }
}
function playerHit(p, b) {
  if (p.shield) {
    p.shield = false; p.invuln = 1.6; sfx.shieldBreak(); addShake(0.35); game.hitstop = 0.08;
    fx('shieldBreak', p.x);
    popup(p.x, ARENA.b - 70, 'SHIELD BROKE', '#7cff6b', 18);
    return;
  }
  killPlayer(p, Math.sign(p.x - b.x) || 1, 'OUCH!');
}
function killPlayer(p, dir, reason) {
  p.dead = true; p.deadT = 0; p.dx = p.x; p.dy = ARENA.b; p.dvx = dir * 230; p.dvy = -560;
  p.lives--;
  game.harpoons = game.harpoons.filter((h) => h.owner !== p.id); game.bullets = game.bullets.filter((u) => u.owner !== p.id);
  sfx.death();
  addShake(0.8); flash('#ff3d5a', 0.5); game.hitstop = 0.18; game.slowmoT = 0.5;
  fx('playerDie', p.x);
  // Co-op: while a partner is still standing the stage carries on; the downed diver returns next stage.
  if (alivePlayers().length) {
    banner(`P${p.id + 1} DOWN`, p.lives > 0 ? 'BACK NEXT STAGE' : 'OUT OF LIVES', 1.4, '#ff3d5a', true);
    return;
  }
  music('playMusic', false); game.shots = [];
  const left = game.coop ? game.players.some((q) => q.lives > 0) : p.lives > 0;
  banner(reason, game.coop ? (left ? 'TRY AGAIN' : 'NO LIVES LEFT') : left ? `${p.lives} ${p.lives === 1 ? 'LIFE' : 'LIVES'} LEFT` : 'NO LIVES LEFT', 1.6, '#ff3d5a');
  setState('dying');
}
// knocked-out tumble (shared by 'dying' and a co-op partner going down mid-stage)
function tumble(p, dt) {
  p.deadT += dt;
  p.dvy += G * dt; p.dx += p.dvx * dt; p.dy += p.dvy * dt; p.rot += dt * 11 * Math.sign(p.dvx);
  if (p.dx < ARENA.l + 10 || p.dx > ARENA.r - 10) { p.dvx *= -0.7; p.dx = clamp(p.dx, ARENA.l + 10, ARENA.r - 10); }
  if (p.dy > ARENA.b && p.dvy > 0) { p.dy = ARENA.b; p.dvy *= -0.45; p.dvx *= 0.6; if (Math.abs(p.dvy) > 60) addShake(0.15); }
}
// a co-op partner who went down tumbles off, then sits out until the next stage
function updateDowned(dt) { for (const p of game.players) if (p.dead && !p.out) { tumble(p, dt); if (p.deadT > 2.1) p.out = true; } }
function updateDying(dt) {
  for (const p of game.players) if (p.dead && !p.out) tumble(p, dt);
  if (game.stateT > 2.1) {
    if (game.players.some((p) => p.lives > 0)) resetStage();
    else gameOver();
  }
}
function timeOver() { sfx.timeout(); alivePlayers().forEach((p, i) => killPlayer(p, i ? -1 : 1, 'TIME OVER')); }
function gameOver() {
  setState('gameover'); game.contT = 9.99; sfx.gameover(); music('playMusic', true); music('playTrack', 'over');
  game.newHigh = saveRun(game.score, game.level);
}
// add a run to the local best-runs table; returns true when it is the new #1
function saveRun(score, stage) {
  const entry = { score, stage, date: new Date().toISOString().slice(0, 10) };
  const list = [...game.scores, entry].sort((a, b) => b.score - a.score).slice(0, 5);
  game.scores = list; store('harpoonpop.scores', list);
  return list[0] === entry && score > 0;
}
function levelClear() {
  const t = Math.ceil(Math.max(0, game.timeLeft)), timeBonus = t * 50;
  addScore(timeBonus, -1); // team bonus: counts toward the shared score only
  game.clearInfo = { timeBonus, secs: t };
  setState('clear'); sfx.clear();
  game.shots = []; game.enemies.forEach((e) => { if (!e.dying) killEnemy(e); });
  game.fireworks = Array.from({ length: 6 }, (_, i) => ({ t: 0.35 + i * 0.32, x: rand(160, 800), y: rand(120, 260), c: Object.values(ITEMS)[i % 7].color, done: false }));
  banner('STAGE CLEAR', game.def.name, 2.2, '#7cff6b');
  fx('confetti');
}

// Stage-clear fireworks, fired on a schedule set by levelClear()
function updateFireworks() {
  game.fireworks.forEach((fw, i) => {
    if (fw.done || game.stateT < fw.t) return; fw.done = true;
    fx('firework', fw.x, fw.y, fw.c);
    sfx.firework(i);
  });
}
function updatePlay(dt, pdt) {
  updatePlayers(pdt);
  updateWeapons(pdt);
  if (game.slowT > 0) game.slowT -= dt;
  updateBubbles(dt * (game.slowT > 0 ? 0.4 : 1));
  updatePending(dt);
  updateItems(dt);
  updateDynamite(dt);
  updateEnemies(dt); maybeSpawnEnemy(dt);
  game.bubbles = game.bubbles.filter((b) => !b.dead);
  if (game.comboT > 0) { game.comboT -= dt; if (game.comboT <= 0) game.combo = 0; }
  game.nearCd -= dt;
  updateDowned(dt);
  checkPlayers();
  if (game.state !== 'play') return;
  if (!game.bubbles.length && !game.pending.length && game.dyna <= 0) { levelClear(); return; }
  game.timeLeft -= dt;
  const sec = Math.ceil(game.timeLeft);
  if (sec <= 10 && sec !== game.lastTick && sec > 0) { game.lastTick = sec; sfx.tick(sec <= 5); }
  if (game.timeLeft <= 0) timeOver();
}

/* ============================ §8 POWER-UPS ============================ */
function dropItem(x, y) { game.items.push({ id: ++game.uid, type: pickWeighted(ITEMS), x: clamp(x, ARENA.l + 16, ARENA.r - 16), y, vy: -160, t: 0, landed: false, dead: false }); }
function updateItems(dt) {
  const live = alivePlayers();
  for (const it of game.items) {
    it.t += dt;
    if (!it.landed) {
      const prevY = it.y; it.vy += G * 0.55 * dt; it.y += it.vy * dt;
      if (it.y + 14 >= ARENA.b) { it.y = ARENA.b - 14; it.landed = true; }
      for (const pl of game.platforms) if (it.vy > 0 && it.x > pl.x && it.x < pl.x + pl.w && prevY + 14 <= pl.y && it.y + 14 >= pl.y) { it.y = pl.y - 14; it.landed = true; it.plat = pl; }
    } else if (it.plat && !game.platforms.includes(it.plat)) { it.landed = false; it.plat = null; it.vy = 0; }
    if (it.t > 8) it.dead = true;
    const p = live.find((q) => Math.abs(it.x - q.x) < 24 && it.y > ARENA.b - 64);
    if (p) { applyItem(it, p); it.dead = true; }
  }
  game.items = game.items.filter((i) => !i.dead);
}
function applyItem(it, p = game.player) {
  const def = ITEMS[it.type];
  game.credit = p.id;
  switch (it.type) {
    case 'double': case 'power': case 'gun': p.weapon = it.type === 'double' && (p.weapon === 'double' || p.weapon === 'triple') ? 'triple' : it.type; game.harpoons = game.harpoons.filter((h) => h.owner !== p.id || h.state === 'rise'); break;
    case 'slow': game.slowT = 7; break;
    case 'shield': p.shield = true; break;
    case 'life': p.lives = Math.min(9, p.lives + 1); break;
    case 'dyna': game.dyna = 1; game.dynaCd = 0.15; game.dynaOwner = p.id; break;
  }
  it.type === 'life' ? sfx.life() : sfx.item();
  popup(p.x, ARENA.b - 80, p.weapon === 'triple' && it.type === 'double' ? 'TRIPLE WIRE' : def.label, def.color, 20);
  fx('pickup', p.x, it.x, it.y, def.color);
  // Risk/reward: grabbing a power-up with a bubble right on top of you pays out
  if (game.bubbles.some((b) => Math.hypot(b.x - p.x, b.y - (ARENA.b - 20)) < b.r + 70)) { const pts = 500 * comboMult(); addScore(pts); popup(p.x, ARENA.b - 104, 'DARING! +' + pts, '#ff3d8b', 18); }
}
// Dynamite: every 0.15s, split every bubble bigger than tiny, until only tiny ones remain (classic Pang)
function updateDynamite(dt) {
  if (game.dyna <= 0) return;
  game.dynaCd -= dt; if (game.dynaCd > 0) return;
  game.dynaCd = 0.15;
  const big = game.bubbles.filter((b) => !b.dead && b.size > 0);
  if (!big.length) { game.dyna = 0; return; }
  addShake(0.3); flash('#ff4b3a', 0.12);
  game.credit = game.dynaOwner;
  big.forEach((b) => hitBubble(b, 'dyna', b.x, b.y));
}

/* ============================ §9 JUICE ============================ */
function spawn(o) { if (game.particles.length < QUALITY.particleCap) game.particles.push(Object.assign({ x: 0, y: 0, vx: 0, vy: 0, life: 0.5, t: 0, size: 3, color: '#fff', type: 'dot', g: 0, drag: 0, rot: 0, z: 0, vz: 0 }, o)); }
function popup(x, y, text, color, size) {
  netEmit(['p', rn(x), rn(y), text, color, size]); if (guestMuted()) return;
  // stack on top of any fresh popup nearby so bursts of score stay readable
  for (let i = 0; i < 6 && game.texts.some((t) => t.t < 0.5 && Math.abs(t.x - x) < 70 && Math.abs(t.y - y) < size); i++) y -= size + 2;
  game.texts.push({ x, y, text, color, size, t: 0, life: 0.9 });
}
function banner(big, small, life, color, minor) { netEmit(['b', big, small, life, color, minor]); if (guestMuted()) return; game.banner = { big, small, life, t: 0, color, minor }; }
function toast(msg) { game.toastMsg = { msg, t: 0 }; }
function addShake(a) { netEmit(['k', rn(a)]); if (guestMuted()) return; game.shake = Math.min(1, game.shake + a * (reducedMotion ? 0.3 : 1)); }
function flash(color, a) { netEmit(['f', color, rn(a)]); if (guestMuted()) return; game.flashColor = color; game.flash = Math.max(game.flash, a * (reducedMotion ? 0.4 : 1)); }
// Shared team score; each player's share is tracked for the co-op breakdown (credit -1 = team only)
function addScore(n, credit = game.credit) { game.score += n; const p = game.players[credit]; if (p) p.points += n; }

// Composite visual effects. Gameplay calls them through fx(name, ...) so the host can send them to an
// online guest, who replays the same burst locally (particles themselves never cross the network).
const FX = {
  pop(x, y, r, size, hx, hy) { popBurst({ x, y, r, size }, hx, hy); if (size >= 3) buzz(14); },
  explode(x, y, radius) {

    spawn({ x, y, type: 'light', size: 7, life: 0.45, color: '#ff8a3d' });

    for (let i = 0; i < 8; i++) spawn({ x: x + rand(-20, 20), y: y + rand(-20, 20), vx: rand(-40, 40), vy: rand(-80, -20), life: rand(0.6, 1.1), size: rand(14, 26), color: '#3a2140', type: 'smoke' });
  },

    for (let i = 0; i < 24; i++) { const a = rand(0, Math.PI * 2), sp = rand(120, 420); spawn({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: rand(0.3, 0.6), size: rand(2, 4), color: i % 2 ? '#ffd23f' : '#ff8a3d', type: 'spark', drag: 2 }); }
  },
  playerDie(x) {
    buzz([60, 40, 90]);
    spawn({ x, y: ARENA.b - 24, type: 'ring', size: 20, r2: 160, life: 0.5, color: '#ff3d5a', width: 8 });
    spawn({ x, y: ARENA.b - 24, type: 'light', size: 6, life: 0.5, color: '#ff3d5a' });
    for (let i = 0; i < 24; i++) { const a = rand(0, Math.PI * 2), s = rand(100, 380); spawn({ x, y: ARENA.b - 24, vx: Math.cos(a) * s, vy: Math.sin(a) * s, life: rand(0.3, 0.7), size: rand(2, 4), color: i % 2 ? '#ff3d5a' : '#ffffff', type: 'spark', drag: 2 }); }
  },

    for (let i = 0; i < 18; i++) { const a = rand(0, Math.PI * 2); spawn({ x: x + Math.cos(a) * 28, y: ARENA.b - 22 + Math.sin(a) * 28, vx: Math.cos(a) * 260, vy: Math.sin(a) * 260, life: 0.4, size: 3, color: '#7cff6b', type: 'shard', drag: 2 }); }
  },
  near(x) { spawn({ x, y: ARENA.b - 22, type: 'ring', size: 20, r2: 70, life: 0.35, color: '#9d86ff', width: 3 }); },
  pickup(px, ix, iy, color) {
    buzz(18);
    for (let i = 0; i < 18; i++) spawn({ x: px + rand(-14, 14), y: ARENA.b - rand(0, 40), vx: rand(-20, 20), vy: rand(-420, -160), life: rand(0.4, 0.7), size: rand(2, 3.5), color, type: 'spark', drag: 1.5 });
    spawn({ x: ix, y: iy, type: 'ring', size: 10, r2: 60, life: 0.35, color, width: 4 });
  },
  glass(x, y, w, h) { for (let i = 0; i < 16; i++) spawn({ x: x + rand(0, w), y: y + rand(0, h), vx: rand(-160, 160), vy: rand(-220, 40), life: rand(0.5, 0.9), size: rand(3, 7), color: '#bff4ff', type: 'shard', g: 900 }); },
  muzzle(x, gun) {
    if (gun) { spawn({ x, y: ARENA.b - 52, type: 'flash', size: 9, life: 0.06, color: '#ffd9a0' }); return; }

    vertexShader: `varying vec3 vN; varying vec3 vV; void main(){ vec4 mv = modelViewMatrix * vec4(position, 1.0); vN = normalize(normalMatrix * normal); vV = normalize(-mv.xyz); gl_Position = projectionMatrix * mv; }`,

    const sq = Math.sin(b.squash * Math.PI) * 0.22 * b.squash + b.squash * 0.1;

     costs no shared relay quota and adds the least lag. If the two networks can't connect directly
     within a few seconds, it falls back to the Realtime relay at a lower snapshot rate.

     own diver, applies host snapshots (players, bubbles, wires, items, drones, stingers, platforms,
     HUD state), extrapolates motion between them, and replays the host's effect events (sounds,
     popups, banners, shake, flashes, particle bursts) so both screens look and sound the same. */

class NetPlay {

  }

  _emit(type, p) { (this.handlers[type] || []).forEach((cb) => { try { cb(p || {}); } catch (e) { console.error(e); } }); }

    catch (e) { mod = await import('https://esm.sh/@supabase/supabase-js@2.117.2'); }

    const ch = this.sb.channel('ffg:' + this.gameId + ':' + this.room, { config: { broadcast: { self: false, ack: false }, presence: { key: this.id } } });
    this.channel = ch;

  game.def = null; game.backdrop = buildBackdrop(LEVELS[(Math.random() * LEVELS.length) | 0]);
  game.level = 1;
  game.bubbles = [makeBubble(4, 200, 160, 1), makeBubble(3, 700, 200, -1), makeBubble(2, 480, 140, 1), makeBubble(1, 860, 260, -1)];
  game.platforms = []; game.items = []; game.harpoons = []; game.bullets = []; game.players = []; game.coop = false;
}
// Title screen: bubbles bounce; an invisible "ghost" occasionally pops one for show.
function updateTitle(dt) {
  updateBubbles(dt);
  if (Math.random() < dt * 0.5 && game.bubbles.length) {
    const b = game.bubbles[(Math.random() * game.bubbles.length) | 0];
    b.dead = true; popBurst(b, b.x, b.y);
    if (b.size > 0) for (const d of [-1, 1]) game.bubbles.push(makeBubble(b.size - 1, b.x, b.y, d, { vy: -380 }));
  }
  game.bubbles = game.bubbles.filter((b) => !b.dead);
  if (game.bubbles.length < 2) game.bubbles.push(makeBubble(4, rand(150, 800), 150, Math.random() < 0.5 ? 1 : -1));
}

function update(dt) {
  game.stateT += dt;
  // Player keeps ≥70% speed in bullet-time so slow-mo feels like an advantage, not a drag.
  const pdt = dt * (Math.max(game.timeScale, 0.7) / Math.max(game.timeScale, 0.01));
  switch (game.state) {
    case 'title': updateTitle(dt); break;
    case 'intro':
      updatePlayers(pdt); game.harpoons = []; game.bullets = [];
      if (game.stateT > 1.55 && game.stateT - dt <= 1.55) sfx.go();
      if (game.stateT > 1.8) setState('play');
      break;
    case 'play': updatePlay(dt, pdt); break;
    case 'dying': updateDying(dt); break;
    case 'clear': updatePlayers(pdt); updateWeapons(pdt); updateDowned(dt); updateEnemies(dt); updateFireworks(); break;
    case 'gameover':
      if (game.contT > 0) { const before = Math.ceil(game.contT); game.contT -= dt; if (game.contT <= 0) { game.contT = 0; setState('gameover'); } else if (Math.ceil(game.contT) !== before) sfx.tick(false); }
      break;
  }
}

let lastT = performance.now(), acc = 0, manualClock = false; // manualClock: test harness drives time via __hp.advance()
function tick(dt) {
  game.realT += dt;
  updateFx(dt * (0.35 + 0.65 * game.timeScale));
  Sound.setMuffle(game.state === 'paused' ? 0.15 : clamp((game.timeScale - 0.3) / 0.7, 0, 1)); // bullet-time muffles the music
  if (Net.role === 'guest' && Net.started) { guestTick(dt); return; } // online guest: mirror the host
  if (game.state === 'paused') return;
  if (Net.role === 'host' && Net.started) hostTick(dt);
  if (game.hitstop > 0) { game.hitstop -= dt; return; } // freeze-frame on impacts
  const target = game.slowmoT > 0 ? 0.3 : 1;
  game.timeScale += (target - game.timeScale) * Math.min(1, dt * 12);
  if (game.slowmoT > 0) game.slowmoT -= dt;
  acc += dt * game.timeScale;
  let n = 0;
  while (acc >= STEP && n < 12) { update(STEP); acc -= STEP; n++; }
  if (n >= 12) acc = 0;
  if (n > 0) { input.pressed = false; input.pressed2 = false; }
}
// Adaptive quality: average frame time over ~2 s of play; if it is under ~45 fps, take one step down.
const STEPS = [
  ['pixel ratio 1', () => { QUALITY.dprCap = 1; resize(); }],
  ['bloom off', () => { bloom.enabled = false; }],
  ['shadows off', () => { key.castShadow = false; }],
  ['pixel ratio 0.75', () => { QUALITY.dprCap = 0.75; resize(); }],
];
let qT = 0, qN = 0, qSum = 0;
function adaptQuality(rawDt) {
  if (game.state !== 'play' || document.hidden || QUALITY.level >= STEPS.length) { qT = qN = qSum = 0; return; }
  qT += rawDt; qN++; qSum += rawDt;
  if (qT < 2) return;
  const fps = qN / qSum; qT = qN = qSum = 0;
  if (fps >= 45) return;
  while (QUALITY.level < STEPS.length && STEPS[QUALITY.level][0] === 'pixel ratio 1' && QUALITY.dprCap <= 1) QUALITY.level++; // already there
  if (QUALITY.level >= STEPS.length) return;
  const [name, apply] = STEPS[QUALITY.level++]; apply();
  QUALITY.log.push(`${name} @ ${fps.toFixed(0)} fps`);
}
function frame(now) {
  const raw = (now - lastT) / 1000, dt = Math.min(0.05, raw); lastT = now;
  if (manualClock) { requestAnimationFrame(frame); return; }
  if (raw < 0.5) adaptQuality(raw);
  tick(dt);
  render3D(dt);
  render2D();
  requestAnimationFrame(frame);
}

function start() {
  document.getElementById('boot').hidden = true;
  resize(); seedTitle(); Sound.playTrack('menu');
  requestAnimationFrame(frame);
  hud.focus();
  joinFromLink();
}
// Debug handle for console tinkering (e.g. __hp.loadLevel(9)).
window.__hp = { game, keys, input, newGame, Net, QUALITY, MOBILE, openLobby, goOnline, buildSnap, loadLevel, applyItem, confirmAction, killEnemy, ARENA, ITEMS, Sound, hero, camera,
  gpu: () => ({ ...renderer.info.memory, programs: renderer.info.programs.length }),
  // step the game deterministically (used by the headless test harness); draw=false skips per-step rendering
  setManualClock(on) { manualClock = on; },
  // close-up render of a world point (character review shots); restores the game camera afterwards
  closeup(tx, ty, dist) { const p = camera.position.clone(), r = camera.rotation.clone(); camera.position.set(tx, ty, dist); camera.lookAt(tx, ty, 0); composer.render(0); camera.position.copy(p); camera.rotation.copy(r); ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.clearRect(0, 0, hud.width, hud.height); },
  advance(sec, draw = true) { for (let t = 0; t < sec; t += 1 / 60) { tick(1 / 60); if (draw) render3D(1 / 60); } render3D(1 / 60); render2D(); } };
window.claude?.hot?.ready ? window.claude.hot.ready(start) : start();
</script>
