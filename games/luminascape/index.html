<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LuminaScape</title>
<style>
  :root{
    --clay:#4a3b29; --clay-soft:#6f5b40;
    --cream:248,239,221; --cream-hi:255,250,240;
    --accent:#d98a3d; --accent2:#e8a85a; --accent-ink:#3a2a16;
    --leaf:#7fa860; --leaf-ink:#1e2c14;
    --panel:rgba(var(--cream),.82); --panel-2:rgba(var(--cream),.72);
    --edge:1px solid rgba(255,250,240,.55);
    --shadow:0 10px 30px -8px rgba(74,59,41,.35), 0 2px 6px rgba(74,59,41,.18);
    --shadow-sm:0 4px 14px -4px rgba(74,59,41,.3);
    --r:18px; --r-sm:13px; --ease:cubic-bezier(.34,1.4,.5,1);
  }
  *{ box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
  html,body{ width:100%; height:100%; overflow:hidden; background:#e9dcc2; font-family:'Segoe UI',system-ui,-apple-system,sans-serif; color:var(--clay); -webkit-font-smoothing:antialiased; }
  #app{ position:fixed; inset:0; }
  canvas{ display:block; }
  #load{ position:fixed; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px;
    background:radial-gradient(120% 90% at 50% 28%, #fff6e2 0%, #f3e3bd 45%, #d8e6bf 100%); color:var(--clay); z-index:50; transition:opacity .6s ease; }
  #load.hidden{ opacity:0; pointer-events:none; }
  #load .logo{ font-size:40px; font-weight:800; letter-spacing:.3px; color:var(--clay); text-shadow:0 2px 0 rgba(255,255,255,.6); }
  #load .sub{ font-size:14px; color:var(--clay-soft); letter-spacing:.2px; }
  #load .bar{ width:230px; height:7px; border-radius:6px; background:rgba(74,59,41,.14); overflow:hidden; box-shadow:inset 0 1px 2px rgba(74,59,41,.12); }
  #load .fill{ height:100%; width:0%; border-radius:6px; background:linear-gradient(90deg,var(--accent),var(--accent2)); transition:width .25s ease; }
  #hint{ position:fixed; left:50%; bottom:18px; transform:translateX(-50%); display:flex; align-items:center; gap:7px;
    background:var(--panel); color:var(--clay); border:var(--edge); padding:8px 16px; border-radius:22px; font-size:12.5px; font-weight:600; z-index:20; pointer-events:none; opacity:0; transition:opacity .4s; box-shadow:var(--shadow-sm); backdrop-filter:blur(10px) saturate(1.1); }
  #fps{ position:fixed; left:12px; top:12px; font-size:11px; font-weight:600; color:var(--clay-soft); background:var(--panel-2); border:var(--edge); padding:3px 9px; border-radius:9px; z-index:20; backdrop-filter:blur(6px); box-shadow:var(--shadow-sm); }
  #hud{ display:none; }
  /* --- BOTTOM-CENTER tool palette (sub-palette pops ABOVE the icon row) --- */
  #palette{ position:fixed; left:50%; bottom:14px; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:9px; z-index:30; }
  #modebar{ display:flex; flex-direction:row; gap:7px; padding:8px; border-radius:var(--r); background:var(--panel); border:var(--edge); box-shadow:var(--shadow); backdrop-filter:blur(12px) saturate(1.15); }
  .mbtn{ width:50px; height:50px; border:none; border-radius:14px; background:rgba(255,255,255,.32); color:var(--clay); font-size:22px; cursor:pointer; transition:transform .18s var(--ease), background .15s, box-shadow .15s; display:flex; align-items:center; justify-content:center; line-height:1; box-shadow:inset 0 1px 0 rgba(255,255,255,.6); }
  .mbtn:hover{ background:rgba(255,255,255,.6); transform:translateY(-3px) scale(1.05); }
  .mbtn:active{ transform:translateY(0) scale(.96); }
  .mbtn.on{ background:linear-gradient(180deg,var(--accent2),var(--accent)); color:var(--accent-ink); box-shadow:0 0 0 2px rgba(255,255,255,.7), 0 8px 18px -4px rgba(217,138,61,.6); transform:translateY(-2px); }
  #subpal{ background:var(--panel); border:var(--edge); padding:11px 14px 12px; border-radius:var(--r); box-shadow:var(--shadow); color:var(--clay); min-width:230px; max-width:min(620px,92vw); max-height:70vh; overflow-y:auto; overflow-x:hidden; backdrop-filter:blur(12px) saturate(1.15); --tool:var(--accent); }
  #subpal:empty{ display:none; }
  #subpal[data-mode=water]{ --tool:#5b9bd1; }
  #subpal[data-mode=terrain]{ --tool:var(--accent); } #subpal[data-mode=erase]{ --tool:#c2705a; } #subpal[data-mode=weather]{ --tool:#6f7fa6; }
  #subpal[data-mode=plants]{ --tool:#5a8a4a; } #subpal[data-mode=animals]{ --tool:#b0763e; } #subpal[data-mode=build]{ --tool:#9a8050; } #subpal[data-mode=fence]{ --tool:#c79a5c; }
  #subpal[data-tab=Paint]{ --tool:#b07a3e; } #subpal[data-tab=River]{ --tool:#3fa9b8; } #subpal[data-tab=Climate]{ --tool:#7fa860; }
  #subpal h4{ font-size:13px; margin:0 0 8px; font-weight:800; letter-spacing:.2px; color:var(--clay); display:flex; align-items:center; gap:6px; }
  #subpal h4 .submin{ margin-left:auto; border:none; background:rgba(74,59,41,.10); color:var(--clay-soft); font-size:12px; line-height:1; width:22px; height:22px; border-radius:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
  #subpal h4 .submin:hover{ background:rgba(255,255,255,.55); color:var(--clay); }
  #subpal[data-collapsed='1'] h4{ margin-bottom:0; }
  .ptileLoad{ background-color:rgba(120,110,95,.10); animation:ptLoad 1.15s ease-in-out infinite; }
  @keyframes ptLoad{ 0%,100%{ background-color:rgba(120,110,95,.07); } 50%{ background-color:rgba(150,140,120,.20); } }
  .subtabs{ display:flex; gap:5px; margin:0 0 10px; padding:4px; border-radius:12px; background:rgba(74,59,41,.10); }
  .stab{ flex:1; border:none; border-radius:9px; background:transparent; color:var(--clay-soft); font-size:12px; font-weight:700; padding:6px 10px; cursor:pointer; transition:transform .15s var(--ease), background .15s, color .15s; white-space:nowrap; }
  .stab:hover{ background:rgba(255,255,255,.4); color:var(--clay); }
  .stab.on{ background:rgba(255,255,255,.85); color:var(--clay); box-shadow:var(--shadow-sm); }
  .sbtitle{ font-size:11px; color:var(--clay-soft); margin:-2px 0 9px; line-height:1.35; }
  /* --- palette organize+search (Plants / Animals / Build) --- */
  #subpal .pfind{ display:flex; align-items:center; gap:7px; margin:0 0 9px; background:rgba(74,59,41,.10); border-radius:11px; padding:5px 9px; }
  #subpal .pfind .ico{ font-size:12px; opacity:.6; }
  #subpal .pfind input{ flex:1; border:none; outline:none; background:transparent; color:var(--clay); font-size:12px; font-weight:600; font-family:inherit; min-width:60px; }
  #subpal .pfind input::placeholder{ color:var(--clay-soft); opacity:.8; }
  #subpal .pfind .pclear{ border:none; background:transparent; color:var(--clay-soft); cursor:pointer; font-size:13px; line-height:1; padding:2px 4px; border-radius:7px; opacity:.7; }
  #subpal .pfind .pclear:hover{ background:rgba(255,255,255,.5); opacity:1; }
  .pchips{ display:flex; flex-wrap:wrap; gap:5px; margin:0 0 9px; max-height:64px; overflow-y:auto; padding-right:2px; }
  .pchips::-webkit-scrollbar{ width:6px; } .pchips::-webkit-scrollbar-thumb{ background:rgba(74,59,41,.22); border-radius:6px; }
  .pchip{ border:none; border-radius:999px; background:rgba(255,255,255,.42); color:var(--clay-soft); font-size:11px; font-weight:700; padding:5px 11px; cursor:pointer; white-space:nowrap; transition:transform .14s var(--ease), background .14s, color .14s; box-shadow:inset 0 1px 0 rgba(255,255,255,.55); }
  .pchip:hover{ background:rgba(255,255,255,.72); color:var(--clay); transform:translateY(-1px); }
  .pchip.on{ background:linear-gradient(180deg,var(--tool),color-mix(in srgb,var(--tool) 82%, #000 18%)); color:#fff; box-shadow:0 3px 10px -3px color-mix(in srgb,var(--tool) 70%, transparent); }
  .pchip .n{ opacity:.65; font-weight:600; margin-left:2px; font-variant-numeric:tabular-nums; }
  .pchip.on .n{ opacity:.85; }
  #subpal .pempty{ font-size:12px; color:var(--clay-soft); padding:8px 2px; }
  #subpal .row{ display:flex; flex-wrap:wrap; gap:6px; max-height:150px; overflow-y:auto; padding-right:2px; }
  #subpal .row::-webkit-scrollbar{ width:6px; } #subpal .row::-webkit-scrollbar-thumb{ background:rgba(74,59,41,.22); border-radius:6px; }
  .sbtn{ border:none; border-radius:11px; background:rgba(255,255,255,.4); color:var(--clay); font-size:12px; font-weight:600; padding:7px 12px; cursor:pointer; transition:transform .15s var(--ease), background .15s; text-transform:capitalize; box-shadow:inset 0 1px 0 rgba(255,255,255,.6); }
  .sbtn:hover{ background:rgba(255,255,255,.7); transform:translateY(-1px); }
  .sbtn:active{ transform:scale(.95); }
  .sbtn.on{ background:linear-gradient(180deg,var(--tool),color-mix(in srgb,var(--tool) 82%, #000 18%)); color:#fff; font-weight:700; box-shadow:0 4px 12px -3px color-mix(in srgb,var(--tool) 70%, transparent); }
  .cbtnrow{ display:flex; flex-wrap:wrap; gap:5px; margin:0 0 9px; }
  #worldspanel{ display:none; position:fixed; top:64px; right:14px; z-index:60; width:260px; max-height:70vh; overflow:auto; background:rgba(40,33,24,.94); color:#f3ead8; border-radius:14px; padding:12px; box-shadow:0 10px 30px -8px rgba(0,0,0,.5); font-size:12px; }
  #worldspanel.show{ display:block; }
  #worldspanel .wptitle{ font-weight:700; margin:0 0 8px; font-size:13px; }
  #worldspanel .wprow{ display:flex; align-items:center; gap:6px; padding:5px 6px; border-radius:8px; }
  #worldspanel .wprow.wpcur{ background:rgba(0,255,191,.14); }
  #worldspanel .wpn{ flex:1; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  #worldspanel .wpt{ opacity:.6; font-size:10px; white-space:nowrap; }
  #worldspanel .wpempty{ opacity:.6; padding:6px; }
  #worldspanel .wpacts{ display:flex; gap:6px; margin-top:9px; }
  #worldspanel .wpb{ border:none; border-radius:7px; background:rgba(255,255,255,.16); color:#f3ead8; font-size:11px; font-weight:700; padding:5px 9px; cursor:pointer; }
  #worldspanel .wpb:hover{ background:rgba(255,255,255,.3); }
  #worldspanel .wpacts .wpb{ flex:1; }
  #fgpanel{ display:none; position:fixed; top:64px; right:14px; z-index:60; width:320px; max-height:74vh; overflow:auto; background:rgba(40,33,24,.94); color:#f3ead8; border-radius:14px; padding:12px; box-shadow:0 10px 30px -8px rgba(0,0,0,.5); font-size:12px; }
  #fgpanel.show{ display:block; }
  #fgpanel .fgtitle{ font-weight:700; margin:0 0 10px; font-size:13px; display:flex; align-items:center; justify-content:space-between; gap:8px; }
  #fgpanel .fgcount{ font-size:11px; font-weight:700; opacity:.85; background:rgba(0,255,191,.16); padding:3px 8px; border-radius:8px; white-space:nowrap; }
  #fgpanel .fggrid{ display:grid; grid-template-columns:repeat(2,1fr); gap:8px; }
  #fgpanel .fgcard{ background:rgba(255,255,255,.07); border-radius:10px; padding:8px; display:flex; flex-direction:column; align-items:center; text-align:center; }
  #fgpanel .fgcard.fgunk{ opacity:.5; }
  #fgpanel .fgthumb{ width:72px; height:72px; border-radius:9px; background:rgba(0,0,0,.22) center/cover no-repeat; margin-bottom:6px; }
  #fgpanel .fgthumb.fgq{ display:flex; align-items:center; justify-content:center; font-size:34px; font-weight:800; color:rgba(243,234,216,.5); }
  #fgpanel .fgn{ font-weight:700; font-size:12px; line-height:1.2; }
  #fgpanel .fgc{ font-size:10px; opacity:.7; margin-top:2px; }
  #fgpanel .fgfact{ font-size:10px; opacity:.75; margin-top:5px; line-height:1.3; font-style:italic; }
  .cbtn{ border:none; border-radius:999px; background:rgba(255,255,255,.42); color:var(--clay-soft); font-size:11px; font-weight:700; padding:5px 10px; cursor:pointer; white-space:nowrap; transition:transform .14s var(--ease), background .14s, color .14s; box-shadow:inset 0 1px 0 rgba(255,255,255,.55); }
  .cbtn:hover{ background:rgba(255,255,255,.72); color:var(--clay); transform:translateY(-1px); }
  .cbtn.on{ background:linear-gradient(180deg,var(--tool),color-mix(in srgb,var(--tool) 82%, #000 18%)); color:#fff; box-shadow:0 3px 10px -3px color-mix(in srgb,var(--tool) 70%, transparent); }
  .swatch{ width:34px; height:34px; border-radius:11px; border:2px solid rgba(255,255,255,.7); cursor:pointer; transition:transform .15s var(--ease), box-shadow .15s; box-shadow:var(--shadow-sm); }
  .swatch:hover{ transform:scale(1.06); }
  .swatch.on{ border-color:#fff; transform:scale(1.12); box-shadow:0 0 0 2px var(--accent), var(--shadow-sm); }
  .sgroup{ width:100%; font-size:10.5px; font-weight:800; letter-spacing:.4px; text-transform:uppercase; color:var(--clay-soft); margin:6px 0 1px; }
  .sgroup:first-child{ margin-top:0; }
  #subpal .sl{ display:flex; align-items:center; gap:9px; margin-top:11px; font-size:11px; font-weight:600; color:var(--clay-soft); }
  #subpal .sl span:first-child{ min-width:58px; }
  #subpal .sl .val{ min-width:22px; text-align:right; color:var(--clay); font-variant-numeric:tabular-nums; }
  #subpal input[type=range]{ width:140px; height:4px; -webkit-appearance:none; appearance:none; border-radius:4px; background:rgba(74,59,41,.18); accent-color:var(--accent); }
  #subpal input[type=range]::-webkit-slider-thumb{ -webkit-appearance:none; width:16px; height:16px; border-radius:50%; background:var(--accent); border:2px solid #fff; box-shadow:var(--shadow-sm); cursor:pointer; }
  #subpal .hint{ font-size:12px; color:var(--clay-soft); max-width:340px; line-height:1.45; }
  /* --- TOP-RIGHT: only Play pill + Settings gear --- */
  #topctrl{ position:fixed; right:14px; top:14px; display:flex; flex-direction:row; align-items:center; gap:9px; z-index:31; }
  #topctrl .gear{ width:46px; height:46px; border:none; border-radius:14px; background:var(--panel); border:var(--edge); color:var(--clay); font-size:21px; cursor:pointer; transition:transform .18s var(--ease), background .15s; box-shadow:var(--shadow); backdrop-filter:blur(12px) saturate(1.15); display:flex; align-items:center; justify-content:center; }
  #topctrl .gear:hover{ background:rgba(255,255,255,.62); transform:translateY(-2px) rotate(12deg); }
  #topctrl .gear:active{ transform:scale(.95); }
  #topctrl .gear.open{ background:linear-gradient(180deg,var(--accent2),var(--accent)); color:var(--accent-ink); }
  #topctrl .play{ width:auto; min-width:118px; height:46px; padding:0 20px 0 16px; gap:8px; border-radius:24px; font-size:15px; font-weight:800; letter-spacing:.2px; border:none; cursor:pointer; display:flex; align-items:center; justify-content:center; background:linear-gradient(180deg,var(--accent2),var(--accent)); color:var(--accent-ink); box-shadow:0 8px 22px -6px rgba(217,138,61,.7), inset 0 1px 0 rgba(255,255,255,.5); transition:transform .18s var(--ease); }
  #topctrl .play:hover{ transform:translateY(-2px) scale(1.02); }
  #topctrl .play.playing{ background:linear-gradient(180deg,#9bc47e,var(--leaf)); color:var(--leaf-ink); box-shadow:0 8px 22px -6px rgba(127,168,96,.7), inset 0 1px 0 rgba(255,255,255,.5); }
  #setpop{ position:fixed; right:14px; top:70px; display:none; flex-direction:column; gap:6px; padding:9px; border-radius:var(--r); background:var(--panel); border:var(--edge); box-shadow:var(--shadow); backdrop-filter:blur(12px) saturate(1.15); z-index:31; min-width:170px; }
  #setpop.show{ display:flex; }
  #setpop button{ display:flex; align-items:center; gap:9px; width:100%; border:none; border-radius:11px; background:rgba(255,255,255,.36); color:var(--clay); font-size:13px; font-weight:700; padding:9px 12px; cursor:pointer; transition:transform .15s var(--ease), background .15s; box-shadow:inset 0 1px 0 rgba(255,255,255,.6); }
  #setpop button:hover{ background:rgba(255,255,255,.66); transform:translateX(2px); }
  #setpop button .ic{ font-size:16px; width:20px; text-align:center; }
  /* --- BOTTOM-LEFT undo/redo pair --- */
  #histbar{ position:fixed; left:14px; bottom:14px; display:flex; flex-direction:row; gap:6px; padding:7px; border-radius:var(--r); background:var(--panel); border:var(--edge); box-shadow:var(--shadow); backdrop-filter:blur(12px) saturate(1.15); z-index:30; }
  #histbar button{ width:42px; height:42px; border:none; border-radius:12px; background:rgba(255,255,255,.32); color:var(--clay); font-size:18px; cursor:pointer; transition:transform .18s var(--ease), background .15s; box-shadow:inset 0 1px 0 rgba(255,255,255,.6); display:flex; align-items:center; justify-content:center; }
  #histbar button:hover{ background:rgba(255,255,255,.62); transform:translateY(-2px); }
  #histbar button:active{ transform:scale(.95); }
  #toast{ position:fixed; left:50%; top:18px; transform:translateX(-50%) translateY(-6px); background:var(--panel); color:var(--clay); border:var(--edge); padding:10px 20px; border-radius:22px; font-size:13px; font-weight:700; z-index:40; opacity:0; transition:opacity .3s, transform .3s var(--ease); pointer-events:none; box-shadow:var(--shadow); backdrop-filter:blur(12px) saturate(1.15); }
  #toast.show{ transform:translateX(-50%) translateY(0); }
  #title{ position:fixed; inset:0; display:none; align-items:center; justify-content:center; z-index:60; background:radial-gradient(110% 80% at 50% 30%, rgba(255,246,226,.34) 0%, rgba(120,98,58,.30) 55%, rgba(58,46,28,.5) 100%); opacity:0; transition:opacity .6s ease; }
  #title.show{ opacity:1; }
  .ttcard{ text-align:center; color:#fff; padding:36px 44px; border-radius:30px; background:rgba(248,239,221,.16); border:1px solid rgba(255,250,240,.3); backdrop-filter:blur(8px) saturate(1.1); box-shadow:0 30px 80px -20px rgba(40,30,16,.55); transform:translateY(16px) scale(.98); transition:transform .6s var(--ease); }
  #title.show .ttcard{ transform:translateY(0) scale(1); }
  .ttcard h1{ font-size:54px; font-weight:800; letter-spacing:.5px; text-shadow:0 3px 18px rgba(0,0,0,.4); margin-bottom:4px; }
  .ttcard p{ font-size:16px; color:rgba(255,250,240,.92); margin-bottom:26px; text-shadow:0 2px 8px rgba(0,0,0,.35); }
  .ttrow{ display:flex; gap:14px; justify-content:center; }
  .ttbtn{ border:none; border-radius:26px; padding:14px 30px; font-size:16px; font-weight:800; cursor:pointer; background:rgba(255,250,240,.22); color:#fff; border:1px solid rgba(255,250,240,.35); backdrop-filter:blur(4px); transition:transform .18s var(--ease), background .15s; box-shadow:0 6px 18px -4px rgba(0,0,0,.3); }
  .ttbtn:hover{ background:rgba(255,250,240,.36); transform:translateY(-2px) scale(1.03); }
  .ttbtn:active{ transform:scale(.97); }
  .ttprimary{ background:linear-gradient(180deg,var(--accent2),var(--accent)); color:var(--accent-ink); border-color:rgba(255,255,255,.5); }
  .ttprimary:hover{ background:linear-gradient(180deg,#f0b56a,var(--accent2)); }
  .ttpick{ display:flex; flex-direction:column; gap:8px; margin-bottom:22px; max-height:44vh; overflow:auto; }
  .ttworld{ display:flex; align-items:center; justify-content:space-between; gap:14px; padding:12px 22px; font-size:15px; text-align:left; }
  .ttworld .ttwn{ font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .ttworld .ttwt{ font-size:12px; font-weight:600; opacity:.75; white-space:nowrap; }
  .ttworld.ttcur{ border-color:rgba(255,255,255,.6); background:rgba(255,250,240,.34); }
  .ttworld{ cursor:pointer; }
  .ttacts{ display:flex; gap:6px; margin-left:8px; flex:0 0 auto; }
  .ttmini{ width:26px; height:26px; border:none; border-radius:8px; background:rgba(74,59,41,.12); color:inherit; font-size:13px; line-height:1; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:background .15s; }
  .ttmini:hover{ background:rgba(255,255,255,.65); }
  .ttmini.ttdel:hover{ background:#e8b8ad; }
</style>

<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { Water } from 'three/addons/objects/Water.js';
import { clone as skeletonClone } from 'three/addons/utils/SkeletonUtils.js';
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js';

/* ============================================================================
   MEADOWSMITH — a realistic (non-voxel) cozy world-builder. Chunk 1: SCAFFOLD.
   Chunked heightfield terrain (rolling hills) + splat PBR ground + warm
   painterly lighting (golden sun, soft sky, haze, bloom) + orbit camera +
   GLB asset loader. window.__MS__ debug API for headless verification.
   ========================================================================== */

let ready=false;
const clock={ t:0 };

/* ---------- renderer ---------- */
const app=document.getElementById('app');
const renderer=new THREE.WebGLRenderer({antialias:false, powerPreference:'high-performance', stencil:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,1.25));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.09;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate=false; renderer.shadowMap.needsUpdate=true;   // on-demand: re-render shadows only when the view/scene changes (frame() drives needsUpdate)
app.appendChild(renderer.domElement);
const MAXANISO=Math.min(8,(renderer.capabilities.getMaxAnisotropy&&renderer.capabilities.getMaxAnisotropy())||1);

const scene=new THREE.Scene();
scene.background=new THREE.Color('#cfe6f0');   // sky-tone fallback (the sky dome draws over it)
/* warm hazy distance — soft painterly naturalism (golden-hour haze) */
scene.fog=new THREE.Fog('#e7dec3', 155, 540);

const camera=new THREE.PerspectiveCamera(52, innerWidth/innerHeight, 0.5, 2200);

/* ---------- warm cozy lighting ---------- */
const hemi=new THREE.HemisphereLight('#fff4d6','#8fae7a',0.85); scene.add(hemi);
const sun=new THREE.DirectionalLight('#ffe7b0',1.5);
sun.position.set(120,150,60); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024); sun.shadow.camera.near=10; sun.shadow.camera.far=360; sun.shadow.bias=-0.0006; sun.shadow.normalBias=0.04;
sun.shadow.camera.left=-90; sun.shadow.camera.right=90; sun.shadow.camera.top=90; sun.shadow.camera.bottom=-90;   // tighter frustum: sharper shadows in the play area + cheaper depth pass
scene.add(sun); scene.add(sun.target);
const fill=new THREE.DirectionalLight('#cfe0ff',0.25); fill.position.set(-80,60,-40); scene.add(fill);

/* ---------- gradient sky dome (warm horizon -> soft blue zenith) ---------- */
const skyMat=new THREE.ShaderMaterial({ side:THREE.BackSide, depthWrite:false, fog:false,
  uniforms:{ top:{value:new THREE.Color('#8ec5ee')}, mid:{value:new THREE.Color('#cfe6f0')}, bot:{value:new THREE.Color('#fbeccb')} },
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`varying vec3 vP; uniform vec3 top,mid,bot; void main(){ float h=normalize(vP).y*0.5+0.5;
    vec3 c = h<0.5 ? mix(bot,mid,smoothstep(0.0,0.5,h)) : mix(mid,top,smoothstep(0.5,1.0,h));
    gl_FragColor=vec4(c,1.0); }` });
const sky=new THREE.Mesh(new THREE.SphereGeometry(1600,32,16),skyMat); scene.add(sky);
/* ---------- OPTIONAL REALISTIC HDRI SKY (toggle; default OFF — the animated gradient dome stays default) ---------- */
const _HDRI={ on:false, loader:null, tex:{}, env:{}, pmrem:null, cur:null };
function _hdriPick(){ const df=(typeof _dayFrac==='function')?_dayFrac():1;
  if(df<0.12) return 'night'; if(df<0.34) return 'sunset';
  if(typeof weather!=='undefined'&&weather.overcast>0.5) return 'overcast';
  return (typeof weather!=='undefined'&&weather.wind>0.4)?'partly':'day'; }
function _hdriLoad(name,cb){ if(_HDRI.tex[name]){ cb(_HDRI.tex[name]); return; }
  if(!_HDRI.loader) _HDRI.loader=new RGBELoader();
  _HDRI.loader.load('assets/hdri/'+name+'.hdr', t=>{ t.mapping=THREE.EquirectangularReflectionMapping; _HDRI.tex[name]=t; cb(t); }, undefined, ()=>cb(null)); }
function _hdriApply(force){ if(!_HDRI.on) return; const name=_hdriPick(); if(name===_HDRI.cur && !force) return;
  _hdriLoad(name, t=>{ if(!t||!_HDRI.on) return; _HDRI.cur=name; scene.background=t;
    if(!_HDRI.pmrem) _HDRI.pmrem=new THREE.PMREMGenerator(renderer);
    if(!_HDRI.env[name]) _HDRI.env[name]=_HDRI.pmrem.fromEquirectangular(t).texture;
    scene.environment=_HDRI.env[name]; }); }
function toggleRealisticSky(on){ _HDRI.on=(on!=null)?!!on:!_HDRI.on;
  if(_HDRI.on){ sky.visible=false; _HDRI.cur=null; _hdriApply(true); }
  else { sky.visible=true; scene.environment=null; scene.background=new THREE.Color('#cfe6f0'); if(typeof updateDayNight==='function')updateDayNight(0); }
  return _HDRI.on; }
/* ---------- 3D drifting clouds (puffy low-poly cumulus clusters) ---------- */
const CLOUD={
  n:18, field:900, yMin:150, yMax:250, baseDrift:6, windMul:55, cover:1, on:true,
  root:null, clouds:[], _white:new THREE.Color('#ffffff'), _tmp:new THREE.Color(), _warm:new THREE.Color()
};
function _buildClouds(){
  if(CLOUD.root) return CLOUD.root;
  const root=new THREE.Group(); root.name='cloudRoot'; root.renderOrder=-1; scene.add(root); CLOUD.root=root;
  const puffGeo=new THREE.IcosahedronGeometry(1,1);
  const mkMat=()=>new THREE.MeshStandardMaterial({ color:'#ffffff', roughness:1.0, metalness:0.0,
    flatShading:true, fog:true, transparent:true, opacity:0.96, depthWrite:true });
  const rnd=(a,b)=>a+Math.random()*(b-a);
  for(let i=0;i<CLOUD.n;i++){
    const g=new THREE.Group(); const mat=mkMat(); g.userData.mat=mat;
    const puffs=3+Math.floor(Math.random()*5); const scale=rnd(34,62); g.userData.baseScale=scale;
    for(let p=0;p<puffs;p++){ const m=new THREE.Mesh(puffGeo,mat);
      const ax=rnd(-1,1), az=rnd(-1,1);
      m.position.set(ax*scale*0.9, rnd(-0.15,0.55)*scale*0.45, az*scale*0.9);
      const sx=rnd(0.55,1.0), sy=rnd(0.42,0.7), sz=rnd(0.55,1.0);
      m.scale.set(sx*scale, sy*scale, sz*scale);
      m.castShadow=false; m.receiveShadow=false; m.frustumCulled=true; g.add(m); }
    g.position.set(rnd(-CLOUD.field,CLOUD.field), rnd(CLOUD.yMin,CLOUD.yMax), rnd(-CLOUD.field,CLOUD.field));
    g.userData.phase=Math.random()*6.28; g.userData.gray=rnd(0.0,0.10);
    g.renderOrder=-1; g.frustumCulled=true; root.add(g); CLOUD.clouds.push(g);
  }
  return root;
}
_buildClouds();   // geometry-only build; safe here (depends only on THREE + scene)
function _updateClouds(dt){
  const C=CLOUD; if(!C.root||!C.on){ if(C.root)C.root.visible=false; return; }
  C.root.visible=true; C.root.position.x=cam.tgt.x; C.root.position.z=cam.tgt.z;
  const wx=(weather&&weather.windDir?weather.windDir.x:1), wz=(weather&&weather.windDir?weather.windDir.y:0.3);
  const spd=C.baseDrift+(weather?weather.wind:0)*C.windMul; const dvx=wx*spd*dt, dvz=wz*spd*dt; const F=C.field;
  const dayF=(typeof _dayFrac==='function')?_dayFrac():1; const storm=(weather?weather.storm:0);
  const oc=(weather?weather.overcast:0);                         // overcast: gray + flatten clouds, no storm needed
  const lum=(0.40+0.60*dayF)*(1-storm*0.55)*(1-oc*0.28);
  const warmAmt=Math.max(0, 1-Math.abs(dayF-0.5)*2)*0.45*(1-storm)*(1-oc*0.85);
  C._warm.copy(sun.color);
  for(let i=0;i<C.clouds.length;i++){ const g=C.clouds[i];
    g.position.x+=dvx; g.position.z+=dvz;
    if(g.position.x>F)g.position.x-=2*F; else if(g.position.x<-F)g.position.x+=2*F;
    if(g.position.z>F)g.position.z-=2*F; else if(g.position.z<-F)g.position.z+=2*F;
    g.userData.phase+=dt*0.12; g.position.y+=Math.sin(g.userData.phase)*dt*1.4;
    const m=g.userData.mat;
    C._tmp.copy(C._white).lerp(C._warm,warmAmt).multiplyScalar(lum*(1-g.userData.gray)); m.color.copy(C._tmp);
    m.opacity=THREE.MathUtils.clamp((0.82+storm*0.14+oc*0.16)*C.cover,0,1);
  }
}

/* ---------- post: bloom + warm color-grade ---------- */
const composer=new EffectComposer(renderer,new THREE.WebGLRenderTarget(innerWidth,innerHeight,{samples:4}));
composer.addPass(new RenderPass(scene,camera));
const bloom=new UnrealBloomPass(new THREE.Vector2(innerWidth/2,innerHeight/2),0.32,0.6,0.92); composer.addPass(bloom);   // half-res bloom — visually identical, ~4x cheaper blur
composer.addPass(new OutputPass());
const grade=new ShaderPass({ uniforms:{ tDiffuse:{value:null}, uVig:{value:0.26}, uFlash:{value:0.0}, uHeat:{value:0.0} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float uVig,uFlash,uHeat; varying vec2 vUv;
    void main(){ vec3 c=texture2D(tDiffuse,vUv).rgb; float l=dot(c,vec3(0.299,0.587,0.114));
      c.r+=(l-0.5)*0.05; c.b-=(l-0.5)*0.04;                 // gentle warm split-tone
      c=mix(vec3(l),c,1.06);                                 // +6% saturation
      c+=vec3(0.018,0.012,0.004)*(1.0-smoothstep(0.0,0.4,l)); // warm shadow lift
      float d=distance(vUv,vec2(0.5)); c*=1.0-smoothstep(0.5,0.96,d)*uVig;
      c+=vec3(0.9,0.93,1.0)*uFlash;                          // lightning whiteout
      c+=vec3(0.55,0.20,0.05)*uHeat;                         // volcano heat wash (warm)
      c=mix(c, c*vec3(1.10,0.86,0.66), uHeat*(1.0-vUv.y)*0.7); // ember glow rises from below
      gl_FragColor=vec4(clamp(c,0.0,1.0),1.0); }` }); composer.addPass(grade);
/* ---------- GOD-RAYS: cheap screen-space radial blur off the sun's projected position.
   FRESH ShaderMaterial (own uniforms) → no GLSL collision. tDiffuse MUST stay named that (ShaderPass convention).
   Added AFTER grade so it is the LAST pass; gl_FragColor = graded image + additive shafts.
   uSun is written each frame from frame() (sun world-pos projected to screen). uInt gates it off at night. ---------- */
const GODRAY={ pass:null, _sunScreen:new THREE.Vector2(0.5,0.5), _behind:false, samples:22 };
(()=>{ const p=new ShaderPass({ uniforms:{
    tDiffuse:{value:null}, uSun:{value:GODRAY._sunScreen}, uInt:{value:0.0},
    uDecay:{value:0.94}, uDensity:{value:0.62}, uWeight:{value:0.42}, uAspect:{value:innerWidth/Math.max(1,innerHeight)},
    uTint:{value:new THREE.Color(0xffe6b0)} },
  vertexShader:`varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform vec2 uSun; uniform float uInt,uDecay,uDensity,uWeight,uAspect; uniform vec3 uTint; varying vec2 vUv;
    void main(){ vec3 base=texture2D(tDiffuse,vUv).rgb;
      if(uInt<=0.001){ gl_FragColor=vec4(base,1.0); return; }
      vec2 dir=(vUv-uSun); dir.x*=uAspect; float distSun=length(dir); dir/=`+GODRAY.samples.toFixed(1)+`; dir*=uDensity; dir.x/=uAspect;
      vec2 uv=vUv; float illum=1.0; vec3 shaft=vec3(0.0);
      for(int i=0;i<`+GODRAY.samples+`;i++){ uv-=dir; vec3 s=texture2D(tDiffuse,clamp(uv,0.0,1.0)).rgb;
        float lum=dot(s,vec3(0.299,0.587,0.114)); float mask=smoothstep(0.62,1.0,lum);
        shaft+=s*mask*illum*uWeight; illum*=uDecay; }
      float edge=1.0-smoothstep(0.0,1.15,distSun);
      vec3 rays=shaft*uTint*uInt*edge;
      gl_FragColor=vec4(base+rays,1.0); } `
}); GODRAY.pass=p; composer.addPass(p); })();
composer.setPixelRatio(Math.min(devicePixelRatio,1.25));

/* ---------- terrain textures (CC0 ambientCG) ---------- */
const manager=new THREE.LoadingManager();
manager.onProgress=(u,l,t)=>{ const f=document.getElementById('loadfill'); if(f)f.style.width=(10+85*l/Math.max(1,t))+'%'; };
let _initDone=false;
manager.onLoad=()=>{ if(_initDone)return; _initDone=true;   // the GLTFLoader manager re-fires onLoad after EVERY lazy batch (buildings/animals/decor) — only do first-load init ONCE (else duplicate modebars + re-scatter grass on every placement)
  applyClimate('meadow'); autoBeachAll(); scatterGrass(); buildUI(); setTimeOfDay(DN.t); ready=true; const f=document.getElementById('loadfill'); if(f)f.style.width='100%';   // BARE start: no auto trees/rocks/animals AND no auto grass — grass is paint-driven (GP) now; scatterGrass() rebuilds from the empty GP → 0 blades
  setTimeout(()=>{ const l=document.getElementById('load'); if(l)l.classList.add('hidden'); showTitle(); },450); };
const TL=new THREE.TextureLoader(manager);
const TEX_ID={ grass:'Grass004', dirt:'Ground037', sand:'Ground054', rock:'Rock030' };
function loadTerrainTex(biome,map,srgb){
  const t=TL.load(`assets/textures/terrain/${biome}/${TEX_ID[biome]}_1K-JPG_${map}.jpg`);
  t.wrapS=t.wrapT=THREE.RepeatWrapping; t.anisotropy=MAXANISO; if(srgb)t.colorSpace=THREE.SRGBColorSpace; return t;
}
const TT={};
for(const b of ['grass','dirt','sand','rock']){ TT[b]={ col:loadTerrainTex(b,'Color',true), nrm:loadTerrainTex(b,'NormalGL',false), rgh:loadTerrainTex(b,'Roughness',false) }; }

/* ---------- TERRAIN: chunked heightfield ---------- */
const CH=64;               // quads per chunk side
const CV=CH+1;             // verts per side
const CS=1;                // metres per quad
const CHUNK_W=CH*CS;       // 64 m chunk
const TILE=5.0;            // texture tile size (m)
let seaLevel=1;            // global water level (sculpt land below it = sea; above = beaches)
const chunks=new Map();
const _ckey=(cx,cz)=>cx+','+cz;

/* gentle ROLLING-hill height field (deterministic). Soft, not spiky. */
function terrainH(x,z){
  let h=0;
  h+=2.4*Math.sin(x*0.0125)*Math.cos(z*0.0118);
  h+=1.15*Math.sin(x*0.031+1.7)*Math.cos(z*0.029-0.6);
  h+=0.5*Math.sin(x*0.072+0.4)*Math.cos(z*0.066+2.1);
  const r=Math.hypot(x,z), fall=Math.min(26, Math.max(0,r-95)*0.2);
  return h+6.5-fall;   // clean circular grassy field: gentle rolls, solidly above sea, dipping to ocean only at the rim
}

/* default per-chunk splat: R grass (=1) everywhere; G dirt / B rock / A sand painted later */
function makeSplat(){
  const N=64, d=new Uint8Array(N*N*4);
  for(let i=0;i<N*N;i++){ d[i*4]=255; d[i*4+1]=0; d[i*4+2]=0; d[i*4+3]=0; }
  const t=new THREE.DataTexture(d,N,N,THREE.RGBAFormat); t.needsUpdate=true; t.flipY=false; return t;
}
/* per-chunk CRACK MASK: single RED channel, 0=no cracks, 255=full cracked dry-earth. Same 64² grid as the splat → identical brush write-path. */
function makeCrack(){
  const N=64, d=new Uint8Array(N*N);
  const t=new THREE.DataTexture(d,N,N,THREE.RedFormat); t.needsUpdate=true; t.flipY=false;
  t.minFilter=THREE.LinearFilter; t.magFilter=THREE.LinearFilter; return t;
}
/* per-chunk PAINT-TINT texture: RG, same 64² grid as splat/crk.
   R = paint-type id mapped to 0..255 ((id*255/11) rounded).  G = coverage 0..255.
   NEAREST on ids (must not bleed between types). Default = type 0 / cov 0 → no recolor. */
function makeTint(){
  const N=64, d=new Uint8Array(N*N*2);   // all zero → id 0, coverage 0
  const t=new THREE.DataTexture(d,N,N,THREE.RGFormat); t.needsUpdate=true; t.flipY=false;
  t.minFilter=THREE.NearestFilter; t.magFilter=THREE.NearestFilter; return t;
}
const _TNT_IDQ=255/11;   // id<->byte quantizer (11 = PAINT12.length-1)

/* PBR ground material: blends grass/dirt/rock/sand by the per-chunk splat + auto-rock on steep slopes.
   World-space tiling so textures are seamless across chunk borders. Keeps full PBR lighting/shadows/fog. */
/* ---------- BIOMES (lighter tint-based: re-skin ground/grass/water/plants, reuse the 4 textures) ---------- */
/* CLIMATES — each is a real-world region you SEED then paint freely. chan[] = the 4 splat channels
   (grass/dirt/rock/sand textures) each re-tinted to a ground type, so you paint distinct terrain side by side. */
const BIOMES={
  meadow:{ name:'Meadow', grass:1.0, water:0x2f6476, blade:['#4c7d34','#8fc663'],
    chan:[ {label:'grass',col:'#6fae4a',tint:0x8fce63,mix:0.55},{label:'soil',col:'#9c7b46',tint:0x9c7b46,mix:0.0},{label:'rock',col:'#9aa0a4',tint:0xffffff,mix:0.0},{label:'sand',col:'#e6d8a8',tint:0xe9dcae,mix:0.25} ],
    plants:['tree_oak','tree_default','tree_detailed','tree_fat','tree_small','tree_simple','plant_bush','plant_bushLarge','plant_bushDetailed','flower_redA','flower_yellowA','flower_purpleA','flower_redC','flower_purpleB','mushroom_red','mushroom_tan','mushroom_redGroup','grass_large','grass_leafs','lily_large','stump_round','rock_smallA','rock_largeA','log'] },
  highlands:{ name:'Highlands', grass:1.12, water:0x2c6168, blade:['#3a682b','#79b04e'],
    chan:[ {label:'grass',col:'#5b8f3e',tint:0x6fa548,mix:0.5},{label:'soil',col:'#7a5d3a',tint:0x7a5d3a,mix:0.0},{label:'rock',col:'#8f969a',tint:0xffffff,mix:0.0},{label:'scree',col:'#cabf94',tint:0xc8bd92,mix:0.3} ],
    plants:['tree_pineDefaultA','tree_pineDefaultB','tree_pineRoundA','tree_pineRoundB','tree_pineTallA','tree_pineSmallA','tree_cone','tree_oak','tree_thin','plant_bush','plant_bushTriangle','mushroom_red','mushroom_tanTall','grass_large','grass_leafs','rock_largeA','rock_largeC','rock_tallA','stone_largeA','stump_old','log'] },
  amazon:{ name:'Amazon', grass:1.32, water:0x215a4d, blade:['#2f5e23','#6fae3c'],
    chan:[ {label:'jungle floor',col:'#3f6b2c',tint:0x4f7a30,mix:0.6},{label:'mud',col:'#6e5836',tint:0x6e5836,mix:0.0},{label:'moss rock',col:'#5d7a4a',tint:0x6f8a55,mix:0.45},{label:'clay',col:'#b08a5a',tint:0xb08a5a,mix:0.0} ],

/* sample the EDITABLE heightfield at world (x,z) — bilinear over the chunk's height grid; falls back to the procedural field for un-generated chunks */

const brush={ mode:'raise', radius:14, strength:0.55, autoExpand:true, paintLayer:'dirt', placeType:'tree_oak', placeGroup:'Trees', placeIdx:0, fenceType:'fence_simple', placeYaw:null, roadKind:'dirt', roadHalf:1.4 };
function applyBrush(wx,wz){ _dirtyTerrain(wx,wz,brush.radius);
  const R=brush.radius, R2=R*R;
  const mincx=Math.floor((wx-R)/CHUNK_W), maxcx=Math.floor((wx+R)/CHUNK_W);
  const mincz=Math.floor((wz-R)/CHUNK_W), maxcz=Math.floor((wz+R)/CHUNK_W);

  const touched=new Set();
  for(let cz=mincz;cz<=maxcz;cz++) for(let cx=mincx;cx<=maxcx;cx++){
    let ch=chunks.get(_ckey(cx,cz));
    if(!ch){ if(brush.autoExpand){ ch=buildChunk(cx,cz); seedFromNeighbors(ch); } else continue; }
    const H=ch.heights;
    const i0=Math.max(0,Math.floor((wx-R-ch.ox)/CS)), i1=Math.min(CH,Math.ceil((wx+R-ch.ox)/CS));
    const j0=Math.max(0,Math.floor((wz-R-ch.oz)/CS)), j1=Math.min(CH,Math.ceil((wz+R-ch.oz)/CS));
    let hit=false;
    for(let j=j0;j<=j1;j++) for(let i=i0;i<=i1;i++){
      const px=ch.ox+i*CS, pz=ch.oz+j*CS, dx=px-wx, dz=pz-wz, d2=dx*dx+dz*dz; if(d2>R2) continue;
      const w=Math.cos(Math.min(1,Math.sqrt(d2)/R)*Math.PI)*0.5+0.5, g=j*CV+i;
      if(brush.mode==='raise') H[g]+=brush.strength*w;
      else if(brush.mode==='lower') H[g]-=brush.strength*w;
      else if(brush.mode==='flatten') H[g]+=(target-H[g])*Math.min(0.6,brush.strength*0.25)*w;
      else { const a=(getHeight(px-CS,pz)+getHeight(px+CS,pz)+getHeight(px,pz-CS)+getHeight(px,pz+CS))*0.25; H[g]+=(a-H[g])*Math.min(0.6,brush.strength*0.5)*w; }

    }

  }

  for(const ch of touched){ for(const nb of stitchEdges(ch)) more.add(nb); }
  for(const ch of touched) refreshChunkMesh(ch);
  for(const ch of more) if(!touched.has(ch)) refreshChunkMesh(ch);

function expandRing(){
  let a=Infinity,b=-Infinity,c=Infinity,d=-Infinity;
  for(const ch of chunks.values()){ a=Math.min(a,ch.cx);b=Math.max(b,ch.cx);c=Math.min(c,ch.cz);d=Math.max(d,ch.cz); }
  const add=[];
  for(let cz=c-1;cz<=d+1;cz++) for(let cx=a-1;cx<=b+1;cx++) if(!chunks.has(_ckey(cx,cz))) add.push([cx,cz]);
  for(const e of add){ const ch=buildChunk(e[0],e[1]); seedFromNeighbors(ch); }
  return add.length;

/* ---------- LOCAL-BIOME CLASSIFIER (frame-time only → forward refs safe): sample around cam.tgt / player ---------- */
function _classifyBiome(lx,lz,dt){
  /* sand from painted splat channel A (index.html:610); high sand → desert */
  let sand=0; try{ sand=getSplatWeights(lx,lz).sand||0; }catch(e){}
  /* cold: seasonal snow + live frost + arctic climate seed (index.html:3842 / FROST / _biomeId) */
  const snow=(typeof SEASON!=='undefined'?SEASON.snowAmt:0);
  const frost=(typeof FROST!=='undefined'?FROST.value:0);
  const arcticClimate=(_biomeId==='snow')?0.5:0;
  const cold=Math.min(1, Math.max(snow, frost*0.9)+arcticClimate);
  /* local tree density: nearby placed Trees (same pattern as index.html:3055/3810) */
  let trees=0; const R2=42*42; for(const e of placedObjects){ if(e.group!=='Trees')continue; const dx=e.x-lx,dz=e.z-lz; if(dx*dx+dz*dz<R2){ if(++trees>=8)break; } }
  const forestness=Math.min(1, trees/6);
  /* priority: arctic > desert > forest > meadow. Build a target weight vector (winner-take-most, softened). */
  const wArctic = cold*cold;                       // squared: only real cold counts
  const wDesert = sand>0.5 ? (sand-0.5)*2*(1-wArctic) : 0;
  const wForest = forestness*(1-wArctic)*(1-wDesert);
  const wMeadow = Math.max(0, 1 - wArctic - wDesert - wForest);
  const sum=(wArctic+wDesert+wForest+wMeadow)||1;
  const tA=wArctic/sum, tD=wDesert/sum, tF=wForest/sum, tM=wMeadow/sum;
  const k=Math.min(1, dt*0.8);                     // ~1.2s cross-fade time constant (eased, testable transition)
  _biomeAmb.arctic += (tA-_biomeAmb.arctic)*k;
  _biomeAmb.desert += (tD-_biomeAmb.desert)*k;
  _biomeAmb.forest += (tF-_biomeAmb.forest)*k;
  _biomeAmb.meadow += (tM-_biomeAmb.meadow)*k;
  /* label = biggest live weight */
  const g=_biomeAmb; let b='meadow', bv=g.meadow;
  if(g.forest>bv){b='forest';bv=g.forest;} if(g.desert>bv){b='desert';bv=g.desert;} if(g.arctic>bv){b='arctic';bv=g.arctic;}
  g.biome=b;
  /* push eased levels to the real buses if they exist (real CC0 loops ride these later) */
  if(_ambForestGain)_ambForestGain.gain.value=g.forest;
  if(_ambArcticGain)_ambArcticGain.gain.value=g.arctic;
  if(_ambDesertGain)_ambDesertGain.gain.value=g.desert;
  if(_ambMeadowGain)_ambMeadowGain.gain.value=g.meadow;
  return g;
}

function _wxFrostTag(entry){
  if(!WX_PLANT.has(entry.group)) return;
  entry._frostable=true;
  entry.obj.traverse(m=>{
    if(!m.isMesh||!m.material) return;
    const mats=Array.isArray(m.material)?m.material:[m.material];
    for(const mat of mats){
      if(mat.userData&&mat.userData._wxFrost) continue;
      mat.userData=mat.userData||{}; mat.userData._wxFrost=true;

            'vec3 _fr=mix(gl_FragColor.rgb, vec3(_fl), 0.45);\n'+
            '_fr=mix(_fr, vec3(0.86,0.90,0.97), 0.55);\n'+
            'gl_FragColor.rgb=mix(gl_FragColor.rgb,_fr,clamp(uFrost,0.0,1.0));\n'+

/* RENDER pass — split out of frame() so the FIXED-TIMESTEP loop can run N simulation sub-steps and
   then draw ONCE per animation frame. rt = REAL seconds since the last DRAWN frame; it paces the
   shadow re-render and the fps meter, which are display-rate concerns, not simulation-rate. */
function render(rt){
  /* on-demand shadows: idle animals/wind refresh at ~8Hz; the CAMERA-MOVED refresh is throttled to
     every _shadowMoveEvery-th frame (High=1 every frame, Med=2, Low=3) — the movement hitch fix.
     Shadows snap correct within ~2 frames of the camera stopping (the 8Hz idle path catches it). */
  _shadowAcc+=rt; _frameN++;
  const _camMoved=_lastShTgt.distanceToSquared(cam.tgt)>0.02;
  if(_shadowAcc>0.12 || (_camMoved && (_frameN % _shadowMoveEvery)===0)){ renderer.shadowMap.needsUpdate=true; _shadowAcc=0; _lastShTgt.copy(cam.tgt); }
  composer.render();
  _fpsAcc=_fpsAcc===undefined?1/Math.max(rt,1e-3):_fpsAcc*0.9+(1/Math.max(rt,1e-3))*0.1; _fpsT+=rt;
  if(_fpsT>=0.3){ _fpsT=0; const e=document.getElementById('fps'); if(e)e.textContent=Math.round(_fpsAcc)+' fps'; }
  /* adaptive-quality governor: drop a tier under sustained <45fps, recover above 56 (hysteresis + cooldown) */
  if(_autoQ){ _qCool-=rt;   // silent + wide hysteresis + long cooldown → no flip-flopping, no on-screen spam
    if(_qCool<=0){
      if(_fpsAcc<38 && _qIdx<2){ _qIdx++; setQuality(_QTIERS[_qIdx]); _qCool=6.0; }
      else if(_fpsAcc>57 && _qIdx>0){ _qIdx--; setQuality(_QTIERS[_qIdx]); _qCool=9.0; }
    }
  }
}
/* FIXED-TIMESTEP loop (the "Fix Your Timestep" accumulator). The simulation ALWAYS advances in equal
   _FIXED_DT slices regardless of frame rate, so world speed is identical at 20fps and 144fps — no more
   slow-motion under the old dt=min(realDt,0.05) clamp — and every collision/movement step stays small,
   so animals can't tunnel through fences at low fps. We render ONCE per rAF. If a machine falls far
   behind we cap sub-steps at _MAX_SUB and shed the backlog: accept a brief slow-down, never a spiral. */
const _FIXED_DT=1/60, _MAX_SUB=5; let _simAcc=0;
function loop(){ const now=performance.now(); let rt=(now-_last)/1000; _last=now;
  if(rt>0.25)rt=0.25;                                   // tab-out / breakpoint guard: never bank a huge backlog
  if(ready){ _simAcc+=rt; let steps=0;
    while(_simAcc>=_FIXED_DT && steps<_MAX_SUB){ frame(_FIXED_DT); _simAcc-=_FIXED_DT; steps++; }
    if(steps>=_MAX_SUB) _simAcc=0;                       // couldn't keep up → shed backlog (no death-spiral)
    render(rt); }
  requestAnimationFrame(loop); }

  /* signed gap = object base Y (world bbox min.y) - ground Y under it.

  floatReport:()=>{ const _b=new THREE.Box3(); let maxFloat=0, maxBuried=0, n=0, air=0, worst=null;
    for(const e of placedObjects){ if(e.group==='Animals')continue; _b.setFromObject(e.obj);

      if(gap>maxFloat){ maxFloat=gap; worst={kind:'prop',type:e.type,gap,x:+e.x.toFixed(1),z:+e.z.toFixed(1)}; }
      if(-gap>maxBuried) maxBuried=-gap; }

      const gap=+(_b.min.y-getHeight(a.x,a.z)).toFixed(3); n++;
