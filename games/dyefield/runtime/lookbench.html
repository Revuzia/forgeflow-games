<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DYEFIELD — look bench</title>
<meta name="description" content="LOOK lane bench: sky, water, stylized surfaces and glossy dye in isolation.">
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #c4e6f6; }
  #bench { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
  #hud { position: fixed; left: 12px; top: 12px; z-index: 5; max-width: min(560px, 90vw); padding: 10px 14px; border-radius: 14px;
    background: rgba(20, 32, 58, 0.78); color: #fff8ec; font: 600 12.5px/1.45 'Segoe UI', system-ui, sans-serif; pointer-events: none; white-space: pre-wrap; }
  #hud b { color: #ffa84a; }
  .tm-label { position: fixed; bottom: 14px; z-index: 5; padding: 5px 12px; border-radius: 999px; background: rgba(20, 32, 58, 0.8); color: #fff8ec;
    font: 700 13px/1 'Segoe UI', system-ui, sans-serif; pointer-events: none; }
  #tm-left { left: 14px; } #tm-right { right: 14px; }
  #split-line { position: fixed; top: 0; bottom: 0; left: 50%; width: 2px; margin-left: -1px; background: rgba(255, 248, 236, 0.85); z-index: 4; pointer-events: none; }
  #err { position: fixed; inset: auto 12px 12px 12px; z-index: 9; display: none; max-height: 45vh; overflow: auto; padding: 12px; border-radius: 12px;
    background: #3a0d12; color: #ffd9d4; font: 12px/1.4 Consolas, monospace; white-space: pre-wrap; }
</style>
</head>
<body>
<canvas id="bench" tabindex="-1" aria-label="DYEFIELD look bench"></canvas>
<div id="hud">loading…</div>
<div id="split-line" hidden></div>
<div id="tm-left" class="tm-label" hidden></div>
<div id="tm-right" class="tm-label" hidden></div>
<pre id="err"></pre>
<script type="module" src="./src/lookbench.ts"></script>
</body>
</html>
