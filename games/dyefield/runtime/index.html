<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DYEFIELD — Harbor Cup • 4 v 4</title>
<meta name="description" content="DYEFIELD — an original 4 v 4 turf-paint shooter. Two crews stain an arena; the floor is the scoreboard.">
<meta name="theme-color" content="#2f86dc">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect x='3' y='3' width='58' height='58' rx='16' fill='%2314203a'/%3E%3Cpath d='M12 40c2-10 10-17 20-17s18 7 20 17c-4-3-8-3-11 1-3-3-6-3-9 0-3-3-6-3-9 0-3-4-7-4-11-1z' fill='%23ff8a1f'/%3E%3Ccircle cx='24' cy='20' r='5' fill='%23fff8ec'/%3E%3Cpath d='M38 15l7 11h-14z' fill='%235b4bf0' stroke='%23fff8ec' stroke-width='2' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  /* Critical boot-card styles (the full sheet, src/ui/styles.css, arrives with the module graph). */
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #7fc6ec; }
  #game { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; }
  #ui { position: fixed; inset: 0; z-index: 10; pointer-events: none; }
  #df-boot { position: fixed; inset: 0; z-index: 900; display: grid; place-items: center; font-family: 'Nunito', 'Segoe UI', system-ui, sans-serif; color: #14203a;
    background: radial-gradient(120% 80% at 50% 115%, #0a6a8c 0%, #1fb5c9 38%, rgba(31,181,201,0) 62%), radial-gradient(90% 70% at 50% 0%, #cfedfb 0%, #9cd3ff 45%, #2f86dc 100%); }
  #df-boot .df-card { display: flex; flex-direction: column; align-items: center; gap: 14px; min-width: min(520px, 90vw); padding: 34px 44px 32px; border-radius: 34px;
    background: #fff8ec; border: 4px solid #14203a; box-shadow: 0 10px 0 #14203a; text-align: center; box-sizing: border-box; }
  #df-boot .df-wordmark { margin: 0; font: 400 clamp(56px, 9vw, 112px)/.9 'Lilita One', 'Arial Rounded MT Bold', 'Trebuchet MS', sans-serif; -webkit-text-stroke: 4px #14203a; paint-order: stroke fill; text-shadow: 0 6px 0 #14203a; }
  #df-boot .df-wordmark .dye { color: #ff8a1f; } #df-boot .df-wordmark .field { color: #8a7cff; }
  #df-boot .df-mode { display: inline-flex; gap: 10px; margin: 0; padding: 6px 18px; border-radius: 999px; background: #14203a; color: #fff8ec; font: 400 20px/1 'Lilita One', 'Trebuchet MS', sans-serif; letter-spacing: .08em; }
  #df-boot .df-mode i { font-style: normal; color: #ffa84a; } #df-boot .df-mode i.g { color: #8a7cff; }
  #df-boot .df-progress { position: relative; width: min(420px, 74vw); height: 20px; border-radius: 999px; background: #e9e2d2; border: 3px solid #14203a; overflow: hidden; margin-top: 6px; box-sizing: border-box; }
  #df-boot .df-progress b { position: absolute; left: 0; top: 0; bottom: 0; width: 4%; border-radius: 999px; background: #ff8a1f; }
  #df-boot .df-status { min-height: 1.3em; font-weight: 800; font-size: 14px; color: #22325a; }
  #df-boot pre { white-space: pre-wrap; text-align: left; max-width: 88vw; font: 12.5px/1.45 Consolas, monospace; background: #14203a; color: #ffd9d4; padding: 12px; border-radius: 12px; }
</style>
</head>
<body>
<canvas id="game" tabindex="-1" aria-label="DYEFIELD — game view"></canvas>
<div id="ui"></div>

<div id="df-boot" class="df-boot" role="status" aria-live="polite">
  <div class="df-card">
    <h1 class="df-wordmark" aria-label="DYEFIELD"><span class="dye">DYE</span><span class="field">FIELD</span></h1>
    <p class="df-mode"><i aria-hidden="true">◉</i><span>Harbor Cup • 4 v 4</span><i class="g" aria-hidden="true">▲</i></p>
    <div class="df-progress"><b></b></div>
    <div class="df-status">Loading…</div>
  </div>
</div>

<script>
  // Boot guard (classic script, runs before the module graph): if src/main.ts fails to load or throws
  // before it takes over error reporting, show the message on the card instead of a dead page.
  (function () {
    var done = false;
    function show(title, detail) {
      if (done) return;
      done = true;
      var card = document.querySelector('#df-boot .df-card');
      if (!card) return;
      card.innerHTML = '';
      var h = document.createElement('h1'); h.className = 'df-wordmark'; h.innerHTML = '<span class="dye">DYE</span><span class="field">FIELD</span>';
      var t = document.createElement('h2'); t.textContent = title; t.style.margin = '0'; t.style.color = '#ff5a5f';
      var pre = document.createElement('pre'); pre.textContent = String(detail || 'unknown error');
      var b = document.createElement('button'); b.textContent = 'RELOAD'; b.onclick = function () { location.reload(); };
      b.style.cssText = 'font:400 22px/1 "Lilita One",sans-serif;padding:10px 30px;border-radius:999px;border:3px solid #14203a;background:#ffa84a;cursor:pointer';
      card.append(h, t, pre, b);
    }
    function onErr(e) { show('DYEFIELD could not start', (e && e.error && e.error.stack) || (e && e.message) || e); }
    function onRej(e) { var r = e && e.reason; show('DYEFIELD could not start', (r && r.stack) || r); }
    window.addEventListener('error', onErr);
    window.addEventListener('unhandledrejection', onRej);
    var timer = setTimeout(function () {
      if (!window.__DF_MAIN__) show('DYEFIELD did not start', 'src/main.ts never ran (60 s). Is the dev server up? Run: npm install && npm run dev');
    }, 60000);
    window.__DF_BOOT__ = {
      handoff: function () { window.removeEventListener('error', onErr); window.removeEventListener('unhandledrejection', onRej); clearTimeout(timer); },
      fail: show,
    };
  })();
</script>
<script type="module" src="/src/main.ts"></script>
</body>
</html>
