# last-circle-net: the Last Circle friends-room relay. Workers Free + SQLite-backed Durable Objects.
# NOT DEPLOYED. Deploy only when the owner says so (isimcha85 account), with CLOUDFLARE_API_TOKEN unset (OAuth).
name = "last-circle-net"
main = "src/index.ts"
compatibility_date = "2025-06-01"
workers_dev = true

[[durable_objects.bindings]]
name = "ROOM"
class_name = "Room"

[[durable_objects.bindings]]
name = "METER"
class_name = "Meter"

# SQLite-backed classes only: `new_classes` (key-value backend) is Workers Paid only.
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room", "Meter"]

[vars]
ALLOWED_ORIGINS = "https://forgeflow-games-cdn.isimcha85.workers.dev,https://forgeflowgames.com,https://www.forgeflowgames.com"
# Daily meter (UTC day). New rooms are refused once the active count reaches its cap; running rooms are never cut.
#   strict    -> incoming WebSocket messages + connections counted 1:1 against RAW_CAP
#   billing20 -> ceil(messages/20) + connections against UNIT_CAP (Cloudflare bills incoming WS messages 20:1)
# The account's 100k DO requests/day are SHARED with dyefield-net (RAW_CAP 55000) and any VALE worker, so this
# worker takes a small slice until the owner confirms 20:1 counting on the Free plan (see README).
COUNT_MODE = "strict"
RAW_CAP = "20000"
UNIT_CAP = "20000"
MAX_SOCKETS = "8"
